<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสอบปฏิบัติช่างเครื่องทำความเย็น · HVAC Practical Exam</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html { background-color: #071a33; }
        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
            color: #eef6ff;
            overflow-x: hidden;
            background-color: #071a33;
            background-image:
                radial-gradient(1100px 600px at 12% -8%, rgba(56,189,248,0.20), transparent 60%),
                radial-gradient(1000px 620px at 92% 8%, rgba(37,99,235,0.22), transparent 62%),
                linear-gradient(180deg, #0a2244 0%, #061428 100%);
            background-attachment: fixed;
        }
        #root { min-height: 100vh; }
        .glass-panel { background: rgba(11, 32, 64, 0.68); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(125, 211, 252, 0.22); }
        .frost-card { background: linear-gradient(180deg, rgba(14,40,78,0.92), rgba(9,24,48,0.94)); border: 1px solid rgba(125,211,252,0.22); box-shadow: 0 20px 60px -20px rgba(2,15,40,0.8), inset 0 1px 0 rgba(186,230,253,0.08); }
        .glow-blue { box-shadow: 0 0 24px rgba(56,189,248,0.35); }
        .pipe-bend { transform-origin: left center; transition: transform 0.1s linear; }
        ::-webkit-scrollbar { width: 9px; }
        ::-webkit-scrollbar-track { background: #0a2244; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 5px; }
        .gauge-needle { transform-origin: bottom center; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        .pulse-red { animation: pulseRed 2s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .pulse-ring { animation: pulseRing 2s infinite; }
        @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(59,130,246,.55); } 70% { box-shadow: 0 0 0 16px rgba(59,130,246,0); } 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); } }

        .animate-fade-in { animation: fadeIn .4s ease both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        /* ---- มือถือ ---- */
        * { -webkit-tap-highlight-color: transparent; }
        button, [role="button"] { touch-action: manipulation; }
        .hscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .hscroll::-webkit-scrollbar { height: 6px; }
        @media (max-width: 640px) {
            body { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* ============================================================
           CONFIG
        ============================================================ */
        const PASS = 50;                       // คะแนนผ่านเกณฑ์ / ปลดล็อกด่านถัดไป (ผ่านเมื่อได้ 50% ขึ้นไป)
        const EXAM_MAX = 10;                   // คะแนนสอบเต็ม (ประเมินรวมเมื่อทำครบทุกด่าน)
        const KEY = 'hvac_practical_sim_v1';    // localStorage key
        const starOf = (s) => s >= 98 ? 3 : s >= 90 ? 2 : s >= PASS ? 1 : 0;
        const examScore = (scores) => {
            const sum = MISSIONS.reduce((a, m) => a + (scores[m.id]?.score || 0), 0);
            return Math.round(sum / MISSIONS.length) / 100 * EXAM_MAX;   // 0–10
        };

        // ---- โหมดผู้สอน: แก้เฉลย "ของที่ต้องเบิก" ในด่าน 1 ----
        const TEACHER_CODE = '1234';           // <<< รหัสเดียวใช้ทั้งระบบ: โหมดผู้สอน + พรีวิวทุกด่าน (เปลี่ยนตรงนี้ที่เดียว)
        const AK_KEY = 'hvac_answerkey_prep_v1';
        const loadAnswerKey = () => { try { return JSON.parse(localStorage.getItem(AK_KEY)) || {}; } catch (e) { return {}; } };
        const saveAnswerKey = (o) => { try { localStorage.setItem(AK_KEY, JSON.stringify(o)); } catch (e) {} };
        // เฉลยจริงของแต่ละชิ้น = ค่าเริ่มต้น (correct) เว้นแต่ผู้สอนกดสลับไว้ (override[id])
        const effectiveCorrect = (item, override) =>
            (override && Object.prototype.hasOwnProperty.call(override, item.id)) ? !!override[item.id] : item.correct;

        // ---- โหมดพรีวิว: ปลดล็อกทุกด่านชั่วคราวเพื่อให้ผู้สอนเข้าไปดู/ปรับแก้ ----
        const PV_KEY = 'hvac_preview_all_v1';
        const loadPreview = () => { try { return localStorage.getItem(PV_KEY) === '1'; } catch (e) { return false; } };
        const savePreview = (v) => { try { v ? localStorage.setItem(PV_KEY, '1') : localStorage.removeItem(PV_KEY); } catch (e) {} };

        // ---- โหมดผู้สอน: แก้เฉลยการต่อสาย ด่าน 3 ----
        const WK_KEY = 'hvac_answerkey_wire_v1';
        const loadWireKey = () => { try { const v = JSON.parse(localStorage.getItem(WK_KEY)); return Array.isArray(v) ? v : null; } catch (e) { return null; } };
        const saveWireKey = (a) => { try { localStorage.setItem(WK_KEY, JSON.stringify(a)); } catch (e) {} };
        const pairKey = (a, b) => [a, b].sort().join('|');

        // ---- ระดับเปลวไฟ (ด่าน 2) ----
        const FLAME_LEVELS = [
            { id: 'carburizing', name: 'เปลวคาร์บูไรซิ่ง', look: 'มีขนนกสีขาว 3 ชั้น อะเซทิลีนมากกว่าออกซิเจน' },
            { id: 'neutral',     name: 'เปลวสะเทิน (Neutral)', look: 'กรวยในสีฟ้าสว่างขอบชัด ออกซิเจนกับอะเซทิลีนสมดุล' },
            { id: 'oxidizing',   name: 'เปลวออกซิไดซิ่ง', look: 'เปลวสั้น ปลายแหลม เสียงฟู่ ออกซิเจนมากกว่า' }
        ];
        const FLAME_IDS = FLAME_LEVELS.map(f => f.id);

        // ---- โหมดผู้สอน: เฉลยด่าน 2 / 4 / 5 / 6 (เก็บรวมในคีย์เดียว) ----
        const EK_KEY = 'hvac_answerkey_extra_v2';
        const EK_DEFAULT = {
            braze:      ['cut', 'deburr', 'swage', 'fit', 'gas', 'flame', 'heat', 'braze', 'cool'],
            brazeFlame: 'neutral',
            pipe:   [['COMP_D', 'CON_I'], ['CON_O', 'DRY_I'], ['DRY_O', 'CAP_I'], ['CAP_O', 'EVA_I'], ['EVA_O', 'COMP_S']],
            vacuum: { target: -30 },
            charge: { tank: 'R134A', chgMin: 0, chgMax: 10, shMin: 3, shMax: 8 }
        };
        const cloneEK = (v) => ({
            braze:      (v && v.braze) ? v.braze.slice() : EK_DEFAULT.braze.slice(),
            brazeFlame: (v && FLAME_IDS.includes(v.brazeFlame)) ? v.brazeFlame : EK_DEFAULT.brazeFlame,
            pipe:   (v && v.pipe)  ? v.pipe.map(p => p.slice()) : EK_DEFAULT.pipe.map(p => p.slice()),
            vacuum: { ...EK_DEFAULT.vacuum, ...(v && v.vacuum) },
            charge: { ...EK_DEFAULT.charge, ...(v && v.charge) }
        });
        const loadExtraKey = () => {
            try {
                const v = JSON.parse(localStorage.getItem(EK_KEY)) || {};
                const ek = cloneEK(v);
                if (!(Array.isArray(ek.braze) && ek.braze.length === EK_DEFAULT.braze.length)) ek.braze = EK_DEFAULT.braze.slice();
                if (!(Array.isArray(ek.pipe) && ek.pipe.length)) ek.pipe = EK_DEFAULT.pipe.map(p => p.slice());
                return ek;
            } catch (e) { return cloneEK(null); }
        };
        const saveExtraKey = (o) => { try { localStorage.setItem(EK_KEY, JSON.stringify(o)); } catch (e) {} };
        const extraCustomized = (ek) =>
            JSON.stringify({ b: ek.braze, f: ek.brazeFlame, p: ek.pipe, v: ek.vacuum, c: ek.charge }) !==
            JSON.stringify({ b: EK_DEFAULT.braze, f: EK_DEFAULT.brazeFlame, p: EK_DEFAULT.pipe, v: EK_DEFAULT.vacuum, c: EK_DEFAULT.charge });

        // ---- โหมดการทำข้อสอบ (ผู้สอนเป็นผู้ตั้ง · ค่าเริ่มต้น = สอบจับเวลา) ----
        const MODE_KEY = 'hvac_exam_mode_v1';
        const loadMode = () => { try { return localStorage.getItem(MODE_KEY) === 'practice' ? 'practice' : 'exam'; } catch (e) { return 'exam'; } };
        const saveMode = (m) => { try { localStorage.setItem(MODE_KEY, m); } catch (e) {} };

        // ---- เวลาสอบรวมทั้ง 6 ด่าน (โหมดสอบจับเวลา) · 0 = จับเวลาแยกรายด่านตามเดิม ----
        const ET_KEY = 'hvac_exam_total_v1';       // วินาที
        const ES_KEY = 'hvac_exam_started_v1';     // timestamp ms ที่เริ่มจับเวลาสอบ
        const loadExamTotal = () => { try { const n = parseInt(localStorage.getItem(ET_KEY), 10); return Number.isFinite(n) && n > 0 ? n : 0; } catch (e) { return 0; } };
        const saveExamTotal = (sec) => { try { sec > 0 ? localStorage.setItem(ET_KEY, String(sec)) : localStorage.removeItem(ET_KEY); } catch (e) {} };
        const loadExamStarted = () => { try { const n = parseInt(localStorage.getItem(ES_KEY), 10); return Number.isFinite(n) ? n : null; } catch (e) { return null; } };
        const saveExamStarted = (t) => { try { t ? localStorage.setItem(ES_KEY, String(t)) : localStorage.removeItem(ES_KEY); } catch (e) {} };

        // ---- ล็อกอิน: นักเรียน (รหัส 0 x5) / ครูผู้สอน (รหัส 9 x5) ----
        const STUDENT_PW = '00000';
        const TEACHER_PW = '99999';
        const ST_KEY = 'hvac_student_v1';
        const loadStudent = () => { try { const v = JSON.parse(localStorage.getItem(ST_KEY)); return (v && v.first) ? { ...v, role: v.role === 'teacher' ? 'teacher' : 'student' } : null; } catch (e) { return null; } };
        const saveStudent = (s) => { try { s ? localStorage.setItem(ST_KEY, JSON.stringify(s)) : localStorage.removeItem(ST_KEY); } catch (e) {} };

        /* ============================================================
           ส่งผลสอบเข้า Google Sheet ผ่าน Apps Script Web App
           วิธีใช้: deploy Apps Script เป็น Web App (Execute as: me · Who has access: Anyone)
           แล้วนำลิงก์ที่ลงท้าย /exec มาวางที่ APPS_SCRIPT_URL ด้านล่าง
        ============================================================ */
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_YBfU0WmIschbS7RcZfmP7jxSeePDBnzQm8nOHSZC9OEio5NSxCY84zjdQblV1AK5Aw/exec';   // <<<< ลิงก์ Apps Script Web App (/exec)
        const submitResultToSheet = async (payload) => {
            if (!APPS_SCRIPT_URL) return { ok: false, reason: 'no-url' };
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 15000);
            try {
                // no-cors + text/plain = "simple request" ไม่ต้อง preflight · Apps Script รับได้
                // (อ่าน response กลับไม่ได้ ถือว่าส่งถึงถ้า fetch ไม่ throw)
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload),
                    signal: ctrl.signal
                });
                return { ok: true };
            } catch (e) {
                return { ok: false, reason: String(e) };
            } finally {
                clearTimeout(timer);
            }
        };
        const buildResultPayload = (student, scores, mode, timedOut) => ({
            first: student ? student.first : '',
            last: student ? student.last : '',
            role: student ? student.role : 'student',
            mode: mode === 'exam' ? 'สอบจับเวลา' : 'ฝึกซ้อม',
            examScore: Number(examScore(scores).toFixed(1)),
            examMax: EXAM_MAX,
            avgPercent: Math.round(MISSIONS.reduce((s, m) => s + (scores[m.id] ? scores[m.id].score || 0 : 0), 0) / MISSIONS.length),
            totalStars: MISSIONS.reduce((s, m) => s + (scores[m.id] ? scores[m.id].stars || 0 : 0), 0),
            passedCount: MISSIONS.filter(m => (scores[m.id] ? scores[m.id].score : 0) >= PASS).length,
            doneCount: MISSIONS.filter(m => scores[m.id]).length,
            timedOut: !!timedOut,
            submittedAt: new Date().toISOString(),
            levels: MISSIONS.map(m => ({
                id: m.id, title: m.title,
                score: scores[m.id] ? (scores[m.id].score ?? null) : null,
                stars: scores[m.id] ? (scores[m.id].stars || 0) : 0,
                attempts: scores[m.id] ? (scores[m.id].attempts || 0) : 0
            })),
            userAgent: (typeof navigator !== 'undefined' ? navigator.userAgent : '')
        });

        const MISSIONS = [
            { id: 'prep',   title: 'ด่าน 1 · เตรียมงานเครื่องทำความเย็น', icon: 'fa-toolbox',         desc: 'เบิกเครื่องมือ อุปกรณ์วงจร ไฟฟ้า และวัสดุ ให้ครบสำหรับงานประกอบระบบเครื่องทำความเย็น', time: 150 },
            { id: 'braze',  title: 'ด่าน 2 · ลำดับงานเชื่อมท่อ',        icon: 'fa-fire-burner',       desc: 'เรียงขั้นตอนการเชื่อมท่อทองแดงแบบไร้เขม่า',      time: 120 },
            { id: 'wire',   title: 'ด่าน 3 · ต่อวงจรไฟฟ้าตู้เย็น',        icon: 'fa-bolt',              desc: 'เดินวงจร เทอร์โมสตัท–โอเวอร์โหลด–เคอร์เรนต์รีเลย์–คอมเพรสเซอร์ พร้อมสวิตช์ประตูและหลอดไฟ แล้วคล้องคลิปแอมป์วัดกระแสคอมเพรสเซอร์', time: 200 },
            { id: 'pipe',   title: 'ด่าน 4 · เดินท่อน้ำยา',             icon: 'fa-diagram-project',   desc: 'ต่อท่อน้ำยาให้ครบวงจร: คอมเพรสเซอร์ → คอยล์ร้อน → ดรายเออร์ → แคปทิ้ว → คอยล์เย็น → กลับคอมเพรสเซอร์', time: 200 },
            { id: 'vacuum', title: 'ด่าน 5 · ทำสุญญากาศ',              icon: 'fa-gauge',             desc: 'ต่อสายเกจเข้าปั๊มแวคคั่มและระบบให้ถูกต้อง แล้วดึงสุญญากาศ กดหยุดให้ได้ค่าตามมาตรฐาน', time: 200 },
            { id: 'charge', title: 'ด่าน 6 · เลือก & เติมน้ำยา',        icon: 'fa-temperature-half',  desc: 'เลือกถังน้ำยา → ต่อสายเกจ → เติมน้ำยาให้เข็มนิ่งและ Superheat อยู่ในเกณฑ์ (คะแนนรวม 3 ขั้น)', time: 240 }
        ];

        const loadScores = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
        const saveScores = (o) => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} };

        /* ============================================================
           SHARED COMPONENTS
        ============================================================ */
        const Header = ({ mode, setMode, goMap, student, onLogout }) => {
            const isTeacher = student && student.role === 'teacher';
            return (
            <div className="flex flex-col sm:flex-row justify-between items-center gap-2 sm:gap-3 px-3 py-2.5 sm:p-4 glass-panel sticky top-0 z-50 shadow-[0_8px_30px_-10px_rgba(2,15,40,0.7)] border-b border-sky-400/20">
                <div className="flex items-center gap-2 sm:gap-3 cursor-pointer group min-w-0" onClick={goMap}>
                    <i className="fa-solid fa-snowflake text-sky-300 text-2xl sm:text-3xl drop-shadow-[0_0_10px_rgba(56,189,248,0.6)] group-hover:rotate-180 transition-transform duration-700 shrink-0"></i>
                    <h1 className="text-base sm:text-xl font-extrabold leading-tight text-transparent bg-clip-text bg-gradient-to-r from-sky-200 via-sky-300 to-cyan-300 truncate">ระบบสอบปฏิบัติช่างเครื่องทำความเย็น</h1>
                </div>
                <div className="flex items-center gap-2 sm:gap-3 flex-wrap justify-center shrink-0">
                    {isTeacher && (
                        <div className="flex space-x-2">
                            <button onClick={() => setMode('practice')} className={`px-4 py-2 rounded-lg font-medium transition-colors border text-sm ${mode === 'practice' ? 'bg-blue-600/20 border-blue-500 text-blue-400' : 'bg-transparent border-slate-600 text-slate-400 hover:text-white'}`}>
                                <i className="fa-solid fa-graduation-cap mr-2"></i> โหมดฝึกซ้อม
                            </button>
                            <button onClick={() => setMode('exam')} className={`px-4 py-2 rounded-lg font-medium transition-colors border text-sm ${mode === 'exam' ? 'bg-red-600/20 border-red-500 text-red-400' : 'bg-transparent border-slate-600 text-slate-400 hover:text-white'}`}>
                                <i className="fa-solid fa-stopwatch mr-2"></i> โหมดสอบจับเวลา
                            </button>
                        </div>
                    )}
                    {student && (
                        <div className="flex items-center gap-2 text-xs text-sky-100 bg-[#0b2547]/80 border border-sky-400/25 rounded-lg px-2.5 py-1.5">
                            <i className={`fa-solid ${isTeacher ? 'fa-chalkboard-user text-cyan-300' : 'fa-user-graduate text-sky-300'}`}></i>
                            <span className="font-semibold text-white max-w-[160px] truncate">{student.first} {student.last}</span>
                            {isTeacher && <span className="text-[10px] px-1 rounded bg-sky-600 text-white">ผู้สอน</span>}
                            <button onClick={onLogout} title="ออกจากระบบ" className="ml-1 px-1.5 py-0.5 rounded border border-sky-400/25 text-sky-200/70 hover:text-red-300 hover:border-red-400/60"><i className="fa-solid fa-right-from-bracket"></i></button>
                        </div>
                    )}
                </div>
            </div>
            );
        };

        const Stars = ({ n, size = 'text-base' }) => (
            <span className={size}>
                {[1, 2, 3].map(i => (
                    <i key={i} className={`fa-solid fa-star ${i <= n ? 'text-yellow-400' : 'text-slate-700'}`}></i>
                ))}
            </span>
        );

        const MissionEnd = ({ score, maxScore, onBack, retry, feedback }) => {
            const passed = score >= PASS;
            return (
                <div className="frost-card flex flex-col items-center justify-center p-8 rounded-2xl max-w-lg mx-auto mt-10 text-center animate-fade-in relative overflow-hidden">
                    <div className="absolute -top-20 left-1/2 -translate-x-1/2 w-56 h-56 bg-sky-400/15 rounded-full blur-3xl pointer-events-none"></div>
                    <i className={`fa-solid ${passed ? 'fa-medal text-cyan-300 drop-shadow-[0_0_16px_rgba(56,189,248,0.6)]' : 'fa-triangle-exclamation text-red-400 drop-shadow-[0_0_15px_rgba(239,68,68,0.5)]'} text-7xl mb-3 relative z-10`}></i>
                    <h2 className="text-2xl font-bold mb-1 relative z-10 text-white">รายงานผลปฏิบัติงาน</h2>
                    <div className="relative z-10 my-2"><Stars n={starOf(score)} size="text-2xl" /></div>
                    <div className="text-5xl font-black my-3 relative z-10">
                        <span className={passed ? "text-cyan-300" : "text-red-400"}>{score}</span>
                        <span className="text-2xl text-sky-300/50"> / {maxScore}</span>
                    </div>
                    <div className={`text-sm font-bold mb-3 relative z-10 ${passed ? 'text-cyan-300' : 'text-red-400'}`}>
                        {passed ? '✅ ผ่านเกณฑ์ — ปลดล็อกด่านถัดไป' : `✗ ยังไม่ผ่าน (ต้องได้ ${PASS}% ขึ้นไป)`}
                    </div>
                    {feedback && <div className="bg-[#08213f]/80 p-4 rounded-lg text-sky-100/90 w-full mb-6 border border-sky-400/15 text-sm relative z-10">{feedback}</div>}
                    <div className="flex space-x-4 w-full relative z-10">
                        <button onClick={retry} className="flex-1 py-3 bg-[#0e2850] hover:bg-[#143567] border border-sky-400/25 rounded-lg font-semibold transition text-sky-100"><i className="fa-solid fa-rotate-right mr-2"></i> ปฏิบัติใหม่</button>
                        <button onClick={onBack} className="flex-1 py-3 bg-gradient-to-r from-sky-400 to-cyan-300 hover:from-sky-300 hover:to-cyan-200 text-[#062033] rounded-lg font-bold transition glow-blue"><i className="fa-solid fa-map-location-dot mr-2"></i> กลับสู่ภารกิจ</button>
                    </div>
                </div>
            );
        };

        const TimerPill = ({ left }) => {
            const low = left <= 15;

            { id: 'armaflex',     cat: 'mat',  name: 'ฉนวนยางหุ้มท่อ',           icon: 'fa-bandage',             correct: false },
            { id: 'pvcglue',      cat: 'mat',  name: 'น้ำยาประสานท่อ PVC',       icon: 'fa-fill-drip',           correct: false }
        ];

        const GamePrep = ({ mode, onFinish, answerKey = {} }) => {
            const grouped = React.useMemo(() => {
                const g = {};
                PREP_CATS.forEach(c => { g[c.key] = PREP_ITEMS.filter(i => i.cat === c.key).slice().sort(() => Math.random() - 0.5); });
                return g;
            }, []);
            const required = PREP_ITEMS.filter(i => effectiveCorrect(i, answerKey)).map(i => i.id);
            const akCustomized = Object.keys(answerKey).length > 0;

            const [selected, setSelected] = useState([]);
            const [result, setResult] = useState(null);
            const toggle = (id) => setSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);

            const check = () => {
                let s = 100;
                const msgs = [];
                const missing = required.filter(id => !selected.includes(id));
                const wrong = selected.filter(id => !required.includes(id));
                if (missing.length) { s -= missing.length * 5; msgs.push(`ขาดอุปกรณ์ที่จำเป็น ${missing.length} ชิ้น`); }
                if (wrong.length)   { s -= wrong.length * 7;   msgs.push(`หยิบของหลอก / ไม่เกี่ยวข้อง ${wrong.length} ชิ้น`); }

                if (wrong.some(id => id === 'r32' || id === 'r22' || id === 'r410a')) { s -= 10; msgs.push('⚠️ เลือกน้ำยาผิดชนิด — เครื่องทำความเย็นในบ้านใช้ R-134a เท่านั้น'); }
                if (wrong.includes('txv')) { s -= 6; msgs.push('⚠️ ระบบนี้ลดความดันด้วยแคปทิ้ว ไม่ใช้เอ็กซ์แพนชันวาล์ว'); }
                if (missing.includes('nitrogen')) { s -= 8; msgs.push('⚠️ ไม่มีไนโตรเจนไล่ระบบขณะเชื่อม จะเกิดเขม่าออกไซด์อุดตันในท่อ'); }
                if (missing.includes('drier')) { s -= 6; msgs.push('⚠️ ขาดไดร์เออร์ ความชื้นจะไปจับตัวจนแคปทิ้วตัน'); }
                if (missing.includes('vacuum')) { s -= 6; msgs.push('⚠️ ขาดแวคคั่มปั๊ม ทำสุญญากาศไล่อากาศและความชื้นไม่ได้'); }
                const core = ['compressor', 'evaporator', 'condenser', 'captube'].filter(id => missing.includes(id));
                if (core.length) { s -= core.length * 4; msgs.push('⚠️ ขาดอุปกรณ์หลักของวงจรทำความเย็น'); }
                if (missing.includes('currentrelay') && missing.includes('overload')) { s -= 6; msgs.push('⚠️ ขาดชุดสตาร์ท/ป้องกันคอมเพรสเซอร์ (เคอร์เรนต์รีเลย์ + โอเวอร์โหลด)'); }

                s = Math.max(0, Math.round(s));
                setResult({ score: s, msg: msgs.length ? msgs.join(' · ') : 'ยอดเยี่ยม! เบิกอุปกรณ์ครบถ้วนและไม่หลงหยิบของหลอกเลยแม้แต่ชิ้นเดียว' });
            };

            if (result) return <MissionEnd score={result.score} maxScore={100} feedback={result.msg}
                onBack={() => onFinish(result.score, result.msg)} retry={() => { setResult(null); setSelected([]); }} />;

            return (
                <div className="max-w-5xl mx-auto p-4 sm:p-6">
                    <div className="bg-slate-800 p-6 rounded-xl shadow-lg border-l-4 border-blue-500 mb-6">
                        <h2 className="text-2xl font-bold text-white mb-2">ใบสั่งงาน: <span className="text-orange-400">ประกอบและติดตั้งระบบเครื่องทำความเย็น</span></h2>
                        <p className="text-slate-300">เบิกเครื่องมือ อุปกรณ์ในวงจร อุปกรณ์ไฟฟ้า และวัสดุ ให้ครบสำหรับงานตัด–ขยาย–ดัด–เชื่อมท่อ ทำสุญญากาศ และเดินวงจรไฟฟ้าคอมเพรสเซอร์ <span className="text-red-400 font-semibold">ระวังของที่วางปนมาเพื่อล่อให้หยิบผิด</span></p>
                        {mode === 'practice' && <p className="text-yellow-400 text-sm mt-3"><i className="fa-solid fa-lightbulb"></i> โหมดฝึกซ้อม: พิจารณาแต่ละชิ้นว่าใช้กับระบบเครื่องทำความเย็นในบ้านจริงหรือไม่ — บางชิ้นเป็นของงานปรับอากาศหรือระบบขนาดใหญ่ที่วางปนมาเพื่อลวง เลือกให้ตรงชนิดน้ำยาและอุปกรณ์ลดความดันของระบบ</p>}
                    </div>

                    {akCustomized && <div className="mb-4 text-xs text-yellow-300 bg-yellow-900/20 border border-yellow-700/40 rounded-lg px-3 py-2"><i className="fa-solid fa-user-pen mr-2"></i> เฉลยด่านนี้ถูกปรับแต่งโดยผู้สอน</div>}

                    <div className="flex items-center justify-between mb-5 bg-slate-900/80 px-4 py-2 rounded-lg border border-slate-700">
                        <span className="text-slate-300 text-sm"><i className="fa-solid fa-box-open mr-2 text-blue-400"></i> เลือกแล้ว <span className="font-bold text-white">{selected.length}</span> ชิ้น (มีของให้เลือกทั้งหมด {PREP_ITEMS.length})</span>
                        {selected.length > 0 && <button onClick={() => setSelected([])} className="text-xs text-slate-400 hover:text-red-400"><i className="fa-solid fa-eraser mr-1"></i> ล้างที่เลือก</button>}
                    </div>

                    {PREP_CATS.map(cat => (
                        <div key={cat.key} className="mb-6">
                            <h3 className={`text-sm font-bold uppercase tracking-wide border-l-4 pl-3 mb-3 ${cat.accent}`}>{cat.label}</h3>
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                                {grouped[cat.key].map(item => {
                                    const on = selected.includes(item.id);
                                    return (
                                        <div key={item.id} onClick={() => toggle(item.id)}
                                            className={`p-3 rounded-xl cursor-pointer flex flex-col items-center justify-center text-center transition-all border-2 min-h-[104px]
                                            ${on ? 'bg-slate-700 border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.3)] scale-[1.03]' : 'bg-slate-900 border-slate-700 hover:border-slate-500'}`}>
                                            <i className={`fa-solid ${item.icon} text-2xl mb-2 ${on ? 'text-blue-400' : 'text-slate-500'}`}></i>

                        <i className="fa-solid fa-clipboard-check mr-2"></i> ยืนยันการเบิกอุปกรณ์
                    </button>

        };

        /* ============================================================
           MINI-GAME 2 — ลำดับงานเชื่อมท่อ
        ============================================================ */
        const BRAZE_STEPS = {
            cut:    { id: 'cut',    name: 'ตัดท่อด้วยคัตเตอร์',            detail: 'หมุนช้าๆ เพื่อไม่ให้ท่อบี้' },
            deburr: { id: 'deburr', name: 'ลบคมท่อ (Reaming)',             detail: 'คว่ำปลายท่อลงขณะลบคมกันเศษร่วง' },
            swage:  { id: 'swage',  name: 'ตอกขยายปลายท่อ (Swaging)',      detail: 'ตอกปลายท่อด้านหนึ่งให้บานพอสวมอีกท่อได้ ลึกประมาณเส้นผ่านศูนย์กลางท่อ' },
            fit:    { id: 'fit',    name: 'สวมท่อ / ข้อต่อ',               detail: 'เช็ดทำความสะอาดแล้วสวมให้แน่นสนิท' },
            gas:    { id: 'gas',    name: 'เปิดวาล์วออกซิเจนและอะเซทิลีน',  detail: 'เปิดอะเซทิลีนก่อนแล้วจุดไฟ ตามด้วยเปิดออกซิเจน' },
            flame:  { id: 'flame',  name: 'ปรับตั้งเปลวไฟให้ถูกระดับ',      detail: 'เลือกระดับเปลวไฟให้เหมาะกับงานเชื่อมท่อทองแดง' },
            heat:   { id: 'heat',   name: 'ให้ความร้อนชิ้นงาน',            detail: 'เผาให้ร้อนจนเป็นสีแดงเชอรี่รอบข้อต่อ' },
            braze:  { id: 'braze',  name: 'ป้อนลวดเชื่อมเงิน',             detail: 'ให้ลวดละลายด้วยความร้อนของท่อ ไม่ใช่จ่อเปลวไฟที่ลวด' },
            cool:   { id: 'cool',   name: 'ปิดวาล์วแก๊สและรอเย็น',         detail: 'ปิดออกซิเจนก่อนแล้วปิดอะเซทิลีน · ห้ามใช้น้ำราด' }
        };
        const BRAZE_DEFAULT_ORDER = EK_DEFAULT.braze;

        const GameBrazing = ({ mode, onFinish, brazeKey, flameKey }) => {
            const order = (Array.isArray(brazeKey) && brazeKey.length === BRAZE_DEFAULT_ORDER.length) ? brazeKey : BRAZE_DEFAULT_ORDER;
            const correctSequence = order.map(id => BRAZE_STEPS[id]).filter(Boolean);
            const correctFlame = FLAME_IDS.includes(flameKey) ? flameKey : 'neutral';
            const akCustom = order.join(',') !== BRAZE_DEFAULT_ORDER.join(',') || correctFlame !== 'neutral';
            const [available, setAvailable] = useState(() => [...correctSequence].sort(() => Math.random() - 0.5));
            const [sequence, setSequence] = useState([]);
            const [flameSel, setFlameSel] = useState(null);
            const [result, setResult] = useState(null);

            const selectItem = (item) => { setAvailable(available.filter(i => i.id !== item.id)); setSequence([...sequence, item]); };
            const removeItem = (item) => { setSequence(sequence.filter(i => i.id !== item.id)); setAvailable([...available, item]); };

            const checkSequence = () => {
                let s = 100, errors = 0;
                const step = 100 / correctSequence.length;
                sequence.forEach((item, i) => { if (!correctSequence[i] || item.id !== correctSequence[i].id) { s -= step; errors++; } });
                if (sequence.length < correctSequence.length) { s -= 25; errors += 2; }

                const idx = (id) => sequence.findIndex(i => i.id === id);
                const gIdx = idx('gas'), fIdx = idx('flame'), hIdx = idx('heat'), swIdx = idx('swage'), ftIdx = idx('fit');
                const notes = [];

                if (gIdx === -1 || (fIdx !== -1 && gIdx > fIdx) || (hIdx !== -1 && gIdx > hIdx)) {
                    s -= 35;
                    notes.push('❌ ต้องเปิดวาล์วออกซิเจน–อะเซทิลีนและจุดไฟ ก่อนปรับเปลวไฟและให้ความร้อน');
                }
                if (swIdx !== -1 && ftIdx !== -1 && swIdx > ftIdx) {
                    s -= 10;
                    notes.push('⚠️ ควรตอกขยายปลายท่อก่อนสวมท่อเข้าด้วยกัน');
                }
                if (flameSel !== correctFlame) {
                    s -= 25;
                    if (flameSel === 'oxidizing') notes.push('⚠️ เปลวออกซิไดซิ่ง ออกซิเจนเกิน ทำผิวทองแดงเกิดออกไซด์ รอยเชื่อมพรุน');
                    else if (flameSel === 'carburizing') notes.push('⚠️ เปลวคาร์บูไรซิ่งมีเขม่าคาร์บอน ทำให้ประสานไม่ติดและงานสกปรก');
                    else notes.push('⚠️ เลือกระดับเปลวไฟไม่ถูกต้อง');
                }

                const flName = (FLAME_LEVELS.find(f => f.id === correctFlame) || {}).name || 'เปลวสะเทิน';
                let msg;
                if (notes.length) msg = notes.join(' · ');
                else if (errors === 0) msg = `สมบูรณ์แบบ! ลำดับงานถูกต้องและตั้ง${flName}ได้เหมาะกับงาน`;
                else msg = `จัดลำดับผิดพลาด ${errors} จุด`;

                setResult({ score: Math.max(0, Math.round(s)), msg });
            };

            if (result) return <MissionEnd score={result.score} maxScore={100} feedback={result.msg}
                onBack={() => onFinish(result.score, result.msg)}
                retry={() => { setResult(null); setSequence([]); setFlameSel(null); setAvailable([...correctSequence].sort(() => Math.random() - 0.5)); }} />;

            return (
                <div className="max-w-6xl mx-auto p-4 sm:p-6">
                    <div className="text-center mb-6">
                        <h2 className="text-2xl font-bold text-orange-400">ขั้นตอนงานเชื่อมท่อ (Brazing Standard)</h2>
                        <p className="text-slate-300">เรียงลำดับขั้นตอนการทำงานให้ถูกต้อง และเลือกระดับเปลวไฟที่เหมาะกับงานเชื่อมท่อทองแดง</p>
                        {akCustom && <p className="mt-2 text-xs text-yellow-300 bg-yellow-900/20 border border-yellow-700/40 rounded px-2 py-1 inline-block"><i className="fa-solid fa-user-pen mr-1"></i> เฉลยด่านนี้ถูกปรับแต่งโดยผู้สอน</p>}
                    </div>
                    <div className="flex flex-col md:flex-row gap-6">
                        <div className="flex-1 bg-slate-800/80 p-5 rounded-xl border border-slate-600">
                            <h3 className="text-lg font-bold text-white mb-4 flex justify-between">

                                        <div>

                                        </div>
                                        <i className="fa-solid fa-chevron-right text-slate-600 group-hover:text-orange-500"></i>

                        <div className="flex-1 bg-slate-800/80 p-5 rounded-xl border border-orange-500/50 shadow-[0_0_20px_rgba(249,115,22,0.1)]">
                            <h3 className="text-lg font-bold text-orange-400 mb-4"><i className="fa-solid fa-sort-amount-down mr-2"></i> ลำดับงานของคุณ</h3>

                    </div>

                    <div className="mt-6 bg-slate-800/80 p-5 rounded-xl border border-orange-500/40">
                        <h3 className="text-lg font-bold text-orange-300 mb-1"><i className="fa-solid fa-fire mr-2"></i> เลือกระดับเปลวไฟ</h3>
                        <p className="text-xs text-slate-400 mb-3">ตั้งเปลวไฟให้ถูกระดับสำหรับงานเชื่อมประสานท่อทองแดง</p>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            {FLAME_LEVELS.map(f => {
                                const on = flameSel === f.id;
                                return (
                                    <button key={f.id} onClick={() => setFlameSel(f.id)}
                                        className={`text-left p-3 rounded-lg border-2 transition ${on ? 'border-orange-500 bg-orange-900/30' : 'border-slate-700 bg-slate-900 hover:border-slate-500'}`}>
                                        <div className={`font-bold text-sm ${on ? 'text-orange-200' : 'text-slate-200'}`}>{f.name}{on && <i className="fa-solid fa-circle-check ml-2 text-orange-400"></i>}</div>
                                        <div className="text-[11px] text-slate-400 mt-1 leading-snug">{f.look}</div>
                                    </button>
                                );

                        </div>
                        {mode === 'practice' && <p className="text-yellow-400 text-xs mt-3"><i className="fa-solid fa-lightbulb"></i> เปลวสะเทิน (ออกซิเจน : อะเซทิลีน สมดุล) เหมาะกับการเชื่อมประสานท่อทองแดง</p>}
                    </div>

                    <button onClick={checkSequence} disabled={sequence.length !== correctSequence.length || !flameSel} className="w-full py-4 mt-6 bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-500 hover:to-red-500 disabled:from-slate-700 disabled:to-slate-800 disabled:text-slate-500 text-xl font-bold rounded-xl shadow-lg transition-colors border border-orange-500/50">
                        ตรวจสอบมาตรฐานการปฏิบัติงาน
                    </button>
                </div>
            );
        };

        /* ============================================================
           MINI-GAME 3 — ต่อวงจรไฟฟ้าตู้เย็น (Current Relay + OLP)
           แก้ตำแหน่งจุดต่อที่ WIRE_NODES และเฉลยที่ WIRE_CORRECT / checkWiring()
        ============================================================ */
        // จัดวางเป็นตาราง ไม่ซ้อนกัน — จุดต่ออยู่ในกรอบอุปกรณ์ของตัวเอง (up:true = ป้ายอยู่ด้านบนจุด)
        const WIRE_NODES = {
            E:    { label: 'E',    x: 11, y: 9  },
            L:    { label: 'L',    x: 11, y: 19 },
            N:    { label: 'N',    x: 11, y: 29 },
            TH1:  { label: 'เข้า', x: 35, y: 14 },
            TH2:  { label: 'ออก', x: 45, y: 14 },
            OLP1: { label: 'เข้า', x: 69, y: 14 },
            OLP2: { label: 'ออก', x: 79, y: 14 },
            CC:   { label: 'C',    x: 40, y: 37 },
            CS:   { label: 'S',    x: 35, y: 52 },
            CR:   { label: 'R',    x: 46, y: 52 },
            CB:   { label: 'ตัวถัง (E)', x: 77, y: 52 },
            RLYR: { label: 'R',    x: 38, y: 78 },
            RLYS: { label: 'S',    x: 48, y: 78 },
            DS1:  { label: 'เข้า', x: 8,  y: 53 },
            DS2:  { label: 'ออก', x: 15, y: 53 },
            BL1:  { label: '1',    x: 8,  y: 79 },
            BL2:  { label: '2',    x: 15, y: 79 }
        };
        // คู่สายที่ถูกต้อง (ไม่สนลำดับ) — วงจรตู้เย็นประตูเดียว ใช้เคอร์เรนต์รีเลย์แบบ RSIR
        // ค่านี้เป็น "เฉลยเริ่มต้น" — ผู้สอนแก้ทับได้ผ่านโหมดผู้สอน
        const WIRE_CORRECT = [
            ['L', 'TH1'],      // ไฟเข้าเทอร์โมสตัท
            ['TH2', 'OLP1'],   // เทอร์โมสตัท -> โอเวอร์โหลด
            ['OLP2', 'CC'],    // โอเวอร์โหลด -> ขั้ว C ของคอมเพรสเซอร์ (รีเลย์แบบ 2 ขั้ว เสียบที่คอม)
            ['RLYR', 'CC'],    // รีเลย์ R -> ขั้ว C (คอยล์รันอนุกรมในตัวรีเลย์)
            ['RLYS', 'CS'],    // รีเลย์ S -> ขั้ว S (ขดสตาร์ท ตัดออกเมื่อสตาร์ทติด)
            ['CR', 'N'],       // ขั้ว R (ขดรัน) -> นิวทรัล
            ['E', 'CB'],       // สายดิน -> ตัวถังคอมเพรสเซอร์
            ['L', 'DS1'],      // ไฟเข้าสวิตช์ประตู
            ['DS2', 'BL1'],    // สวิตช์ประตู -> หลอดไฟ
            ['BL2', 'N']       // หลอดไฟ -> นิวทรัล
        ];
        const WIRE_FULLNAME = {
            L: 'ปลั๊ก L', N: 'ปลั๊ก N', E: 'ปลั๊ก E',
            TH1: 'เทอร์โมสตัท เข้า', TH2: 'เทอร์โมสตัท ออก',
            OLP1: 'โอเวอร์โหลด เข้า', OLP2: 'โอเวอร์โหลด ออก',
            CC: 'คอมเพรสเซอร์ C', CS: 'คอมเพรสเซอร์ S', CR: 'คอมเพรสเซอร์ R', CB: 'ตัวถังคอมเพรสเซอร์',
            RLYR: 'รีเลย์ R', RLYS: 'รีเลย์ S',
            DS1: 'สวิตช์ประตู 1', DS2: 'สวิตช์ประตู 2',
            BL1: 'หลอดไฟ 1', BL2: 'หลอดไฟ 2'
        };
        const WIRE_MSG = {
            'L|TH1': 'ไม่มีไฟ L เข้าเทอร์โมสตัท',
            'OLP1|TH2': 'เทอร์โมสตัทไม่ได้ต่อไปโอเวอร์โหลด',
            'CC|OLP2': 'โอเวอร์โหลดไม่ได้ต่อเข้าขั้ว C ของคอมเพรสเซอร์',
            'CC|RLYR': 'รีเลย์ (ขั้ว R) ไม่ได้ต่อเข้าขั้ว C ของคอมเพรสเซอร์',
            'CS|RLYS': 'รีเลย์ (ขั้ว S) ไม่ได้ต่อเข้าขั้ว S (ขดสตาร์ท)',
            'CR|N': 'ขั้ว R (ขดรัน) ไม่ได้ต่อกลับนิวทรัล',
            'CB|E': 'ไม่ได้ต่อสายดินที่ตัวถังคอมเพรสเซอร์',
            'DS1|L': 'สวิตช์ประตูไม่ได้รับไฟ L',
            'BL1|DS2': 'สวิตช์ประตูไม่ได้ต่อไปหลอดไฟ',
            'BL2|N': 'หลอดไฟไม่ได้ต่อกลับนิวทรัล'
        };

        // จุดตัดของ segment 2 เส้น (มุมใดก็ได้) — คืนพิกัดจุดตัด หรือ null
        const segCross = (p1, p2, p3, p4) => {
            const [x1, y1] = p1, [x2, y2] = p2, [x3, y3] = p3, [x4, y4] = p4;
            const den = (x2 - x1) * (y4 - y3) - (y2 - y1) * (x4 - x3);
            if (Math.abs(den) < 1e-6) return null;
            const t = ((x3 - x1) * (y4 - y3) - (y3 - y1) * (x4 - x3)) / den;
            const u = ((x3 - x1) * (y2 - y1) - (y3 - y1) * (x2 - x1)) / den;
            if (t > 0.04 && t < 0.96 && u > 0.04 && u < 0.96)
                return [x1 + t * (x2 - x1), y1 + t * (y2 - y1)];
            return null;
        };
        const bfsNet = (edges, start) => {
            const seen = new Set([start]);
            const st = [start];
            while (st.length) {
                const cur = st.pop();
                edges.forEach(([x, y]) => {
                    if (x === cur && !seen.has(y)) { seen.add(y); st.push(y); }
                    if (y === cur && !seen.has(x)) { seen.add(x); st.push(x); }
                });
            }
            return seen;
        };

        // ---- คลิปแอมป์มิเตอร์: คะแนนตามสายที่เลือกคล้องเพื่อวัดกระแสคอมเพรสเซอร์ ----
        const CLAMP_TIER = (pk) => {
            if (pk === pairKey('OLP2', 'CC') || pk === pairKey('CR', 'N'))
                return { pts: 100, amps: 1.42, note: 'เยี่ยม! คล้องสายขั้วรัน (C/R) วัดกระแสคอมเพรสเซอร์ขณะทำงานได้ตรงจุด' };
            if (pk === pairKey('L', 'TH1') || pk === pairKey('TH2', 'OLP1'))
                return { pts: 85, amps: 1.42, note: 'ใช้ได้ — สายก่อนเข้าคอมเพรสเซอร์ วัดกระแสได้ (จุดมาตรฐานคือสายขั้ว C)' };
            if (pk === pairKey('RLYR', 'CC'))
                return { pts: 75, amps: 1.42, note: 'สายรีเลย์–ขั้ว C อยู่ในเส้นทางกระแสรัน วัดได้ แต่ไม่ใช่จุดมาตรฐาน' };
            if (pk === pairKey('RLYS', 'CS') || pk === pairKey('CS', 'N') || pk === pairKey('CS', 'RLYR'))
                return { pts: 20, amps: 0.15, note: 'สายขดสตาร์ท (S) — ขณะคอมทำงานปกติแทบไม่มีกระแส อ่านได้เกือบ 0 A' };
            if (pk === pairKey('L', 'DS1') || pk === pairKey('DS1', 'DS2') || pk === pairKey('DS2', 'BL1') || pk === pairKey('BL1', 'BL2') || pk === pairKey('BL2', 'N'))
                return { pts: 10, amps: 0.12, note: 'สายวงจรหลอดไฟ ไม่ใช่กระแสของคอมเพรสเซอร์' };
            if (pk === pairKey('E', 'CB'))
                return { pts: 0, amps: 0, note: 'สายดิน — ปกติไม่มีกระแสไหล อ่านได้ 0 A' };
            return { pts: 30, amps: 0, note: 'จุดนี้ไม่ตรงกับการวัดกระแสคอมเพรสเซอร์' };
        };
        const routeMidPt = (P) => {
            let total = 0; const seg = [];
            for (let i = 0; i < P.length - 1; i++) { const l = Math.hypot(P[i + 1][0] - P[i][0], P[i + 1][1] - P[i][1]); seg.push(l); total += l; }
            let d = total / 2;
            for (let i = 0; i < seg.length; i++) { if (d <= seg[i]) { const t = seg[i] ? d / seg[i] : 0; return [P[i][0] + (P[i + 1][0] - P[i][0]) * t, P[i][1] + (P[i + 1][1] - P[i][1]) * t]; } d -= seg[i]; }
            return P[P.length - 1];
        };

        const GameWiring = ({ mode, onFinish, wireKey }) => {
            const [connections, setConnections] = useState([]); // {id,a,b,waypoints:[[x,y]...]}
            const [draft, setDraft] = useState(null);           // {from, points:[[x,y]...]}  เส้นที่กำลังลาก
            const [mouse, setMouse] = useState(null);           // [x,y] viewBox — ปลายเส้นตัวอย่าง
            const [wireSel, setWireSel] = useState(null);       // id เส้นที่เลือก
            const [junctions, setJunctions] = useState([]);     // "id1~id2" จุดจั๊ม
            const [phase, setPhase] = useState('wire');         // wire | clamp
            const [clampWire, setClampWire] = useState(null);   // id เส้นที่คล้องคลิปแอมป์
            const [result, setResult] = useState(null);
            const nodes = WIRE_NODES;
            const correctPairs = (wireKey && wireKey.length) ? wireKey : WIRE_CORRECT;
            const akCustom = !!(wireKey && wireKey.length);
            const uid = () => Math.random().toString(36).slice(2, 9);
            const jkey = (a, b) => [a, b].sort().join('~');
            const isJ = (a, b) => junctions.includes(jkey(a, b));

            const toVB = (e) => {
                const svg = e.currentTarget.ownerSVGElement || e.currentTarget;
                const r = svg.getBoundingClientRect();
                const pt = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
                return [Math.round(((pt.clientX - r.left) / r.width) * 200) / 2,
                        Math.round(((pt.clientY - r.top) / r.height) * 200) / 2];
            };

            const handleNodeClick = (id) => {
                if (result || phase === 'clamp') return;
                if (!draft) { setDraft({ from: id, points: [] }); setWireSel(null); setMouse(null); return; }
                if (id === draft.from) { setDraft(null); setMouse(null); return; }
                setConnections(cs => [...cs, { id: uid(), a: draft.from, b: id, waypoints: draft.points }]);
                setDraft(null); setMouse(null);
            };
            const cancelDraft = () => { setDraft(null); setMouse(null); };
            const undoPoint = () => setDraft(d => (d && d.points.length) ? { ...d, points: d.points.slice(0, -1) } : d);

            useEffect(() => {
                const onKey = (e) => {
                    if (e.key === 'Escape') cancelDraft();
                    if (e.key === 'Backspace' && draft) { e.preventDefault(); undoPoint(); }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [draft]);

            const delWire = (id) => {
                if (phase === 'clamp') return;
                setConnections(cs => cs.filter(c => c.id !== id));
                setJunctions(js => js.filter(k => !k.split('~').includes(id)));
                setWireSel(null);
            };

            // geometry ของทุกเส้น (memo — ไม่ขึ้นกับตำแหน่งเมาส์)
            const routes = React.useMemo(() => connections.map(c => {
                const A = nodes[c.a];
                if (!A) return null;
                let end, anchor;
                if (c.b) {
                    const B = nodes[c.b]; if (!B) return null;
                    end = [B.x, B.y]; anchor = c.b;
                } else {
                    const tc = connections.find(x => x.id === c.tapWire);
                    if (!tc) return null;                 // สายที่ถูกแตะถูกลบไปแล้ว
                    end = c.tapPt; anchor = tc.a;         // เน็ตยึดกับปลาย a ของสายที่ถูกแตะ
                }
                const pts = [[A.x, A.y], ...(c.waypoints || []), end];
                const segs = [];
                for (let k = 0; k < pts.length - 1; k++) segs.push([pts[k], pts[k + 1]]);
                return { id: c.id, a: c.a, b: anchor, tap: c.b ? null : c.tapPt, pts, segs, wp: c.waypoints || [] };
            }).filter(Boolean), [connections]);

            // จุดตัดระหว่างเส้น (มุมใดก็ได้)
            const crossings = React.useMemo(() => {
                const out = [];
                for (let i = 0; i < routes.length; i++) for (let j = i + 1; j < routes.length; j++) {
                    const ri = routes[i], rj = routes[j];
                    if (ri.a === rj.a || ri.a === rj.b || ri.b === rj.a || ri.b === rj.b) continue;
                    for (const si of ri.segs) for (const sj of rj.segs) {
                        const p = segCross(si[0], si[1], sj[0], sj[1]);
                        if (p) out.push({ x: p[0], y: p[1], a: ri.id, b: rj.id, over: j, overSeg: sj });
                    }
                }
                return out;
            }, [routes]);

            // เน็ตไฟฟ้า (รวมจุดจั๊ม)
            const jEdges = junctions.map(k => {
                const [i1, i2] = k.split('~');
                const c1 = connections.find(c => c.id === i1), c2 = connections.find(c => c.id === i2);
                return (c1 && c2) ? [c1.a, c2.a] : null;
            }).filter(Boolean);
            const adj = connections.map(c => {
                if (c.b) return [c.a, c.b];
                const tc = connections.find(x => x.id === c.tapWire);
                return tc ? [c.a, tc.a] : null;
            }).filter(Boolean).concat(jEdges);
            const nNet = bfsNet(adj, 'N');
            const eNet = bfsNet(adj, 'E');
            const colorOf = (na, nb) => (nNet.has(na) && nNet.has(nb)) ? '#38bdf8'
                : (eNet.has(na) && eNet.has(nb)) ? '#22c55e' : '#8B4513';

            const svgMove = (e) => { if (draft) setMouse(toVB(e)); };
            const svgClick = (e) => {
                if (phase === 'clamp') return;
                const [x, y] = toVB(e);
                if (draft) { setDraft(d => ({ ...d, points: [...d.points, [x, y]] })); return; }
                const near = crossings.find(cr => Math.hypot(cr.x - x, cr.y - y) < 3);
                if (near) {
                    const k = jkey(near.a, near.b);
                    setJunctions(js => js.includes(k) ? js.filter(z => z !== k) : [...js, k]);
                } else setWireSel(null);
            };
            const wireClick = (e, r) => {
                e.stopPropagation();
                if (phase === 'clamp') { setClampWire(r.id); return; }
                if (draft) {
                    // ลากมาแตะเส้นอื่น = จั๊มเข้าที่จุดนั้น (ไม่ต้องลากไปถึงขั้วอุปกรณ์)
                    const [x, y] = toVB(e);
                    setConnections(cs => [...cs, { id: uid(), a: draft.from, b: null, tapWire: r.id, tapPt: [x, y], waypoints: draft.points }]);
                    setDraft(null); setMouse(null);
                    return;
                }
                setWireSel(prev => prev === r.id ? null : r.id);
            };

            // ประเมินการต่อวงจร (คืนค่า ไม่ setResult เอง)
            const evalWiring = () => {
                const wireHas = (a, b) => connections.some(c => (c.a === a && c.b === b) || (c.b === a && c.a === b));
                const conn = (a, b) => bfsNet(adj, a).has(b);
                const correctSet = new Set(correctPairs.map(([a, b]) => pairKey(a, b)));
                const isCorrect = (a, b) => correctSet.has(pairKey(a, b));

                if (conn('L', 'N') || wireHas('CC', 'CR') || wireHas('CC', 'CS') || wireHas('CS', 'CR')) {
                    return { short: true, score: 0, msg: '💥 ลัดวงจร (Short Circuit)! ไฟ L ถึงนิวทรัล N หรือลัดขั้ว C/S/R ของคอมเพรสเซอร์' };
                }

                let s = 100;
                const msgs = [];
                const pen = Math.max(6, Math.round(84 / Math.max(1, correctPairs.length)));
                correctPairs.forEach(([a, b]) => {
                    if (!wireHas(a, b) && !conn(a, b)) {
                        s -= pen;
                        msgs.push(WIRE_MSG[pairKey(a, b)] || `ยังไม่ได้ต่อสาย: ${WIRE_FULLNAME[a] || a} ↔ ${WIRE_FULLNAME[b] || b}`);
                    }
                });

                if (!isCorrect('L', 'OLP1') && !isCorrect('L', 'CC') &&
                    (wireHas('L', 'OLP1') || wireHas('L', 'CC') || wireHas('TH1', 'CC'))) {
                    s -= 15; msgs.push('⚠️ ต่อไฟข้ามเทอร์โมสตัท/โอเวอร์โหลด — คอมเพรสเซอร์ไม่มีตัวป้องกัน');
                }
                if ((!isCorrect('RLYS', 'CR') && wireHas('RLYS', 'CR')) || (!isCorrect('RLYR', 'CS') && wireHas('RLYR', 'CS'))) {
                    s -= 10; msgs.push('⚠️ สลับขั้ว S/R ระหว่างรีเลย์กับคอมเพรสเซอร์');
                }
                if (!isCorrect('CS', 'N') && wireHas('CS', 'N')) {
                    s -= 8; msgs.push('⚠️ ต่อขั้ว S ลงนิวทรัลตรงๆ ขดสตาร์ทจะไม่ถูกตัดออก คอมจะร้อนจัด');
                }

                s = Math.max(0, Math.round(s));
                return {
                    short: false, score: s,
                    msg: msgs.length ? msgs.join(' · ')
                        : 'วงจรถูกต้อง! ไฟผ่านเทอร์โมสตัท → โอเวอร์โหลด → รีเลย์ เข้าขั้ว C, ขดรัน C–R ครบวงจรที่นิวทรัล, รีเลย์ต่อขดสตาร์ทที่ขั้ว S และมีสายดินที่ตัวถัง'
                };
            };

            const clampRoute = routes.find(r => r.id === clampWire) || null;
            const clampTier = clampRoute ? CLAMP_TIER(pairKey(clampRoute.a, clampRoute.b)) : null;

            // เฟส 1: ตรวจวงจร แล้วไปเฟสวัดกระแส (หรือฟาวล์ทันทีถ้าลัดวงจร)
            const goMeasure = () => {
                const w = evalWiring();
                if (w.short) { setResult({ score: 0, msg: w.msg }); return; }
                setDraft(null); setMouse(null); setWireSel(null);
                setPhase('clamp');
            };
            // เฟส 2: รวมคะแนน วงจร 75% + จุดวัดกระแส 25%
            const finalize = () => {
                const w = evalWiring();
                if (w.short) { setResult({ score: 0, msg: w.msg }); return; }
                const ci = clampTier || { pts: 0, note: 'ยังไม่ได้คล้องคลิปแอมป์' };
                const total = Math.round(w.score * 0.75 + ci.pts * 0.25);
                setResult({ score: total, msg: w.msg + ' · 🔌 จุดวัดกระแส: ' + ci.note });
            };

            if (result) return <MissionEnd score={result.score} maxScore={100} feedback={result.msg}
                onBack={() => onFinish(result.score, result.msg)} retry={() => { setResult(null); setConnections([]); setDraft(null); setMouse(null); setWireSel(null); setJunctions([]); setPhase('wire'); setClampWire(null); }} />;

            const selRoute = routes.find(r => r.id === wireSel);
            const dFrom = draft ? nodes[draft.from] : null;
            const draftPath = draft ? [[dFrom.x, dFrom.y], ...draft.points, ...(mouse ? [mouse] : [])] : null;

            return (
                <div className="max-w-5xl mx-auto p-4 sm:p-6">
                    <h2 className="text-2xl font-bold text-yellow-400 mb-2">ต่อวงจรไฟฟ้าตู้เย็น{phase === 'clamp' && <span className="text-cyan-300"> — วัดกระแสด้วยคลิปแอมป์</span>}</h2>
                    {phase === 'wire'
                        ? <p className="text-slate-300 mb-1 text-sm">คลิก “จุดต่อ” เพื่อเริ่มลากสาย → คลิกใน “พื้นที่ว่าง” เพื่อหักมุมนำสายหลบเส้นอื่น (เห็นเส้นก่อนวาง) → คลิก “จุดต่อ” ปลายทางเพื่อจบเส้น · ESC / คลิกขวา / คลิกจุดเริ่มซ้ำ = ยกเลิก · คลิกที่เส้นที่วางแล้ว = เลือก/ลบ · แตะจุดที่สายตัดกัน = สลับ ยกข้าม ↔ จุดจั๊ม</p>
                        : <p className="text-cyan-200 mb-1 text-sm"><i className="fa-solid fa-gauge-high mr-1"></i> คล้องคลิปแอมป์รอบ “สายเส้นเดียว” ที่ต้องการวัดกระแสคอมเพรสเซอร์ — คลิกที่เส้นสายในผังเพื่อเลือกจุดวัด (เปลี่ยนได้เรื่อยๆ ก่อนกดยืนยัน)</p>}
                    {akCustom && <p className="mb-2 text-xs text-yellow-300 bg-yellow-900/20 border border-yellow-700/40 rounded px-2 py-1 inline-block"><i className="fa-solid fa-user-pen mr-1"></i> เฉลยการต่อสายด่านนี้ถูกปรับแต่งโดยผู้สอน</p>}
                    {phase === 'clamp' && (
                        <div className="flex items-center justify-between gap-3 flex-wrap mb-2 bg-slate-800 border border-cyan-500/50 rounded-lg px-3 py-2">
                            <span className="text-cyan-100 text-sm"><i className="fa-solid fa-bolt-lightning mr-2 text-cyan-300"></i>{clampRoute ? <>คล้องที่สาย: <b>{WIRE_FULLNAME[clampRoute.a] || clampRoute.a}</b> ↔ <b>{clampRoute.tap ? 'จุดจั๊มบนสายอื่น' : (WIRE_FULLNAME[clampRoute.b] || clampRoute.b)}</b></> : 'ยังไม่ได้เลือกจุดวัด — คลิกที่สายในผัง'}</span>
                            <span className="font-mono font-black text-2xl text-cyan-300 bg-slate-900 border border-cyan-500/40 rounded-lg px-4 py-1 shrink-0">{clampRoute ? clampTier.amps.toFixed(2) : '--.--'}<span className="text-sm text-cyan-400/70"> A</span></span>
                        </div>
                    )}
                    <div className="flex flex-wrap gap-x-4 gap-y-1 mb-2 text-xs text-slate-400">
                        <span>ต่อแล้ว {connections.length} เส้น</span>
                        <span><span className="inline-block w-4 h-1 rounded align-middle mr-1" style={{ background: '#8B4513' }}></span> สายไฟ L</span>
                        <span><span className="inline-block w-4 h-1 rounded bg-sky-400 align-middle mr-1"></span> นิวทรัล N</span>
                        <span><span className="inline-block w-4 h-1 rounded bg-green-500 align-middle mr-1"></span> สายดิน E</span>
                        <span><i className="fa-solid fa-circle text-yellow-400 text-[8px] mr-1"></i> จุดจั๊ม = ต่อถึงกัน</span>
                    </div>
                    {draft && (
                        <div className="flex items-center justify-between gap-2 mb-2 bg-slate-800 border border-yellow-500/60 rounded-lg px-3 py-2 text-sm animate-fade-in">
                            <span className="text-yellow-200"><i className="fa-solid fa-pen-nib mr-2"></i> กำลังลากสายจาก “{WIRE_FULLNAME[draft.from] || draft.from}” · หักมุมแล้ว {draft.points.length} จุด — คลิกอุปกรณ์ปลายทางเพื่อจบเส้น</span>
                            <span className="flex gap-2 shrink-0">
                                <button onClick={undoPoint} disabled={!draft.points.length} className="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-xs"><i className="fa-solid fa-rotate-left mr-1"></i>ถอยจุด</button>
                                <button onClick={cancelDraft} className="px-2 py-1 rounded bg-red-600 hover:bg-red-500 text-white text-xs"><i className="fa-solid fa-xmark mr-1"></i>ยกเลิก</button>
                            </span>
                        </div>
                    )}
                    {!draft && selRoute && (
                        <div className="flex items-center justify-between gap-2 mb-2 bg-slate-800 border border-yellow-500/50 rounded-lg px-3 py-2 text-sm">
                            <span className="text-slate-200"><i className="fa-solid fa-wave-square mr-2 text-yellow-400"></i> เส้นที่เลือก: {WIRE_FULLNAME[selRoute.a] || selRoute.a} <i className="fa-solid fa-arrows-left-right mx-1 text-slate-500"></i> {selRoute.tap ? 'จุดจั๊มบนสายอื่น' : (WIRE_FULLNAME[selRoute.b] || selRoute.b)}</span>
                            <button onClick={() => delWire(selRoute.id)} className="shrink-0 px-3 py-1 rounded bg-red-600 hover:bg-red-500 text-white text-xs font-semibold"><i className="fa-solid fa-trash mr-1"></i> ลบเส้นนี้</button>

                    <div className="hscroll -mx-2 sm:mx-0">
                    <div className="relative w-full min-w-[580px] h-[440px] sm:h-[600px] bg-slate-900 rounded-xl border border-slate-600 p-3 sm:p-4 shadow-inner overflow-hidden select-none"
                         onContextMenu={(e) => { e.preventDefault(); cancelDraft(); }}>
                        <svg className={`absolute top-0 left-0 w-full h-full z-10 ${draft ? 'cursor-crosshair' : ''}`} viewBox="0 0 100 100" preserveAspectRatio="none" onClick={svgClick} onMouseMove={svgMove} onTouchMove={svgMove}>
                            {/* เส้นที่วางแล้ว */}
                            {routes.map(r => {
                                const col = colorOf(r.a, r.b);
                                const sel = wireSel === r.id;
                                const dim = (wireSel && !sel) || (phase === 'clamp' && clampWire && clampWire !== r.id);
                                const d = 'M ' + r.pts.map(p => p.join(' ')).join(' L ');
                                return <path key={'w' + r.id} d={d} fill="none" stroke={col} strokeWidth={sel ? 6 : 3.5} strokeLinecap="round" strokeLinejoin="round" opacity={dim ? 0.22 : 0.95} vectorEffect="non-scaling-stroke" pointerEvents="none" />;
                            })}
                            {/* จุดหักมุมของเส้นที่เลือก */}
                            {selRoute && selRoute.wp.map((p, k) => <circle key={'wp' + k} cx={p[0]} cy={p[1]} r="1.5" fill="#facc15" pointerEvents="none" />)}
                            {/* ยกข้าม: เจาะช่องว่าง + สะพานโค้ง */}
                            {crossings.filter(cr => !isJ(cr.a, cr.b)).map((cr, k) => (
                                <circle key={'g' + k} cx={cr.x} cy={cr.y} r="2.3" fill="#0f172a" pointerEvents="none" />
                            ))}
                            {crossings.filter(cr => !isJ(cr.a, cr.b)).map((cr, k) => {
                                const over = routes[cr.over];
                                if (!over) return null;
                                const [q1, q2] = cr.overSeg;
                                let ux = q2[0] - q1[0], uy = q2[1] - q1[1];
                                const L = Math.hypot(ux, uy) || 1; ux /= L; uy /= L;
                                const rr = 2.7;
                                const a1 = [cr.x - ux * rr, cr.y - uy * rr], a2 = [cr.x + ux * rr, cr.y + uy * rr];
                                const cp = [cr.x - uy * rr * 1.7, cr.y + ux * rr * 1.7];
                                const col = colorOf(over.a, over.b);
                                return <path key={'hop' + k} d={`M ${a1[0]} ${a1[1]} Q ${cp[0]} ${cp[1]} ${a2[0]} ${a2[1]}`} fill="none" stroke={col} strokeWidth="3.5" strokeLinecap="round" vectorEffect="non-scaling-stroke" pointerEvents="none" />;
                            })}
                            {/* จุดจั๊ม (สายตัดกัน) */}
                            {crossings.filter(cr => isJ(cr.a, cr.b)).map((cr, k) => (
                                <circle key={'j' + k} cx={cr.x} cy={cr.y} r="1" fill="#fbbf24" stroke="#0f172a" strokeWidth="0.3" pointerEvents="none" />
                            ))}
                            {/* จุดจั๊ม (ลากมาแตะเส้นอื่น) */}
                            {routes.filter(r => r.tap).map(r => (
                                <circle key={'tap' + r.id} cx={r.tap[0]} cy={r.tap[1]} r="1" fill="#fbbf24" stroke="#0f172a" strokeWidth="0.3" pointerEvents="none" />
                            ))}
                            {/* เส้นที่กำลังลาก (ตัวอย่างก่อนวาง) */}
                            {draftPath && draftPath.length > 1 &&
                                <path d={'M ' + draftPath.map(p => p.join(' ')).join(' L ')} fill="none" stroke="#fde047" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="3 2" opacity="0.9" vectorEffect="non-scaling-stroke" pointerEvents="none" />}
                            {draft && draft.points.map((p, k) => <circle key={'dp' + k} cx={p[0]} cy={p[1]} r="1.4" fill="#fde047" pointerEvents="none" />)}
                            {/* พื้นที่คลิกของแต่ละเส้น */}
                            {routes.map(r => {
                                const d = 'M ' + r.pts.map(p => p.join(' ')).join(' L ');
                                return <path key={'hit' + r.id} d={d} fill="none" stroke="transparent" strokeWidth={phase === 'clamp' ? 18 : 14} vectorEffect="non-scaling-stroke" style={{ cursor: 'pointer' }} onClick={(e) => wireClick(e, r)} />;
                            })}
                            {/* คลิปแอมป์ที่คล้องอยู่ */}
                            {phase === 'clamp' && clampRoute && (() => {
                                const [mx, my] = routeMidPt(clampRoute.pts);
                                return <g pointerEvents="none">
                                    <circle cx={mx} cy={my} r="4.6" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" strokeWidth="2.2" strokeDasharray="16 7" vectorEffect="non-scaling-stroke">
                                        <animateTransform attributeName="transform" type="rotate" from={`0 ${mx} ${my}`} to={`360 ${mx} ${my}`} dur="6s" repeatCount="indefinite" />
                                    </circle>
                                    <circle cx={mx} cy={my} r="1.2" fill="#22d3ee" />
                                    <line x1={mx} y1={my + 4.6} x2={mx} y2={my + 9} stroke="#22d3ee" strokeWidth="2.4" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
                                </g>;
                            })()}
                        </svg>

                        {/* กรอบอุปกรณ์ — จัดวางเป็นตาราง ไม่ซ้อนทับกัน */}
                        <div className="absolute left-[2%] top-[3%] w-[19%] h-[33%] border-2 border-slate-700 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-400">ปลั๊ก</div>
                        <div className="absolute left-[28%] top-[5%] w-[24%] h-[19%] border-2 border-slate-700 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-400">เทอร์โมสตัท</div>
                        <div className="absolute left-[62%] top-[5%] w-[24%] h-[19%] border-2 border-slate-700 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-400">โอเวอร์โหลด (OLP)</div>
                        <div className="absolute left-[2%] top-[43%] w-[19%] h-[19%] border-2 border-slate-700 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-400">สวิตช์ประตู</div>
                        <div className="absolute left-[28%] top-[30%] w-[24%] h-[30%] border-2 border-amber-500/60 rounded-lg bg-amber-500/5 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-amber-300/80">ขั้วคอมเพรสเซอร์</div>
                        <div className="absolute left-[60%] top-[34%] w-[34%] h-[36%] border-4 border-slate-700 rounded-full bg-slate-800/30 pointer-events-none flex items-end justify-center pb-4 text-[11px] font-semibold text-slate-400">คอมเพรสเซอร์</div>
                        <div className="absolute left-[2%] top-[70%] w-[19%] h-[19%] border-2 border-slate-700 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-400">หลอดไฟ</div>
                        <div className="absolute left-[30%] top-[66%] w-[26%] h-[26%] border-2 border-slate-700 rounded-lg bg-slate-800/40 pointer-events-none flex flex-col items-center pt-1.5 text-slate-400">
                            <span className="text-[11px] font-semibold">เคอร์เรนต์รีเลย์</span>
                            <span className="text-[8px] text-slate-500 mt-0.5 text-center px-1">R = ต่อขั้ว C · S = ต่อขั้ว S</span>
                        </div>

                        {Object.entries(nodes).map(([id, node]) => {
                            const isFrom = draft && draft.from === id;
                            const canEnd = draft && draft.from !== id;
                            return (
                            <div key={id} onClick={() => handleNodeClick(id)}
                                className="absolute transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center cursor-pointer z-20 group"
                                style={{ left: `${node.x}%`, top: `${node.y}%` }}>
                                <div className={`w-8 h-8 rounded-full border-4 flex items-center justify-center transition-all shadow-lg
                                    ${isFrom
                                        ? 'bg-yellow-400 border-white scale-125 ring-4 ring-yellow-500/50'
                                        : `bg-slate-700 group-hover:border-yellow-400 group-hover:scale-110 ${canEnd ? 'ring-2 ring-yellow-400/40 ' : ''}${id === 'N' ? 'border-sky-400' : (id === 'E' || id === 'CB') ? 'border-green-500' : id === 'L' ? 'border-[#8B4513]' : 'border-slate-400'}`}`}>
                                    <div className="w-1.5 h-1.5 bg-slate-900 rounded-full"></div>
                                </div>
                                <span className={`absolute ${node.up ? 'bottom-9' : 'top-9'} px-1.5 py-0.5 rounded text-[10px] font-bold whitespace-nowrap border ${isFrom ? 'bg-yellow-500 text-black border-yellow-400' : 'bg-slate-800 text-slate-300 border-slate-600'}`}>{node.label}</span>
                            </div>
                            );
                        })}
                    </div>
                    </div>

                    {mode === 'practice' && phase === 'wire' && <p className="text-yellow-400 text-xs mt-3"><i className="fa-solid fa-lightbulb"></i> ไฟหลัก: ปลั๊ก L → เทอร์โมสตัท → โอเวอร์โหลด → คอม C | รีเลย์(R) → คอม C | รีเลย์(S) → คอม S | คอม R → ปลั๊ก N | ปลั๊ก E → ตัวถังคอม | ไฟส่องสว่าง: ปลั๊ก L → สวิตช์ประตู → หลอดไฟ → ปลั๊ก N — เชื่อมถึง N = ฟ้า, ถึง E = เขียว, ที่เหลือ (L) = น้ำตาล · ลากปลายสายไปแตะ “เส้นอื่นสีเดียวกัน” เพื่อจั๊มได้เลย ไม่ต้องลากถึงขั้วอุปกรณ์เสมอไป</p>}
                    {mode === 'practice' && phase === 'clamp' && <p className="text-cyan-300 text-xs mt-3"><i className="fa-solid fa-lightbulb"></i> วัดกระแสคอมเพรสเซอร์ขณะทำงาน = คล้องคลิปแอมป์รอบ “สายขั้วรัน (C)” — คือสายที่ออกจากโอเวอร์โหลดเข้าขั้ว C หรือสายขดรัน C→N (คล้องได้แค่สายเดียว ห้ามคล้องรวมหลายเส้น)</p>}

                    {phase === 'wire' ? (
                        <button onClick={goMeasure} className="w-full py-4 mt-5 bg-yellow-600 hover:bg-yellow-500 text-lg sm:text-xl font-bold rounded-xl shadow-lg transition-colors text-black">
                            <i className="fa-solid fa-plug-circle-bolt mr-2"></i> จ่ายไฟ → ไปวัดกระแสด้วยคลิปแอมป์
                        </button>
                    ) : (
                        <div className="flex gap-2 mt-5">
                            <button onClick={() => { setPhase('wire'); setClampWire(null); }} className="px-4 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 border border-slate-500 text-slate-200 text-sm font-semibold shrink-0"><i className="fa-solid fa-arrow-left mr-1"></i> กลับไปแก้วงจร</button>
                            <button onClick={finalize} disabled={!clampWire} className="flex-1 py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 disabled:opacity-40 disabled:cursor-not-allowed text-lg font-bold rounded-xl shadow-lg transition-colors text-white">
                                <i className="fa-solid fa-clipboard-check mr-2"></i> ยืนยันจุดวัด · จบด่าน

                </div>
            );
        };

        /* ============================================================
           MINI-GAME 4 — ดัดท่อ (Springback)
        ============================================================ */
        const GameBending = ({ mode, onFinish }) => {
            const targetAngle = 90;
            const springbackForce = 3;
            const [angle, setAngle] = useState(0);
            const [bending, setBending] = useState(false);
            const [released, setReleased] = useState(false);
            const [finalAngle, setFinalAngle] = useState(0);
            const [result, setResult] = useState(null);
            const requestRef = useRef();
            const angleRef = useRef(0);
            const releasedRef = useRef(false);

            const bend = () => {
                angleRef.current = Math.min(180, angleRef.current + 0.8);
                setAngle(angleRef.current);
                if (angleRef.current < 180 && !releasedRef.current) requestRef.current = requestAnimationFrame(bend);
            };
            const startBending = () => { if (releasedRef.current) return; setBending(true); requestRef.current = requestAnimationFrame(bend); };
            const stopBending = () => {
                if (releasedRef.current || !bending) return;
                setBending(false); releasedRef.current = true; setReleased(true);
                cancelAnimationFrame(requestRef.current);
                const actualFinal = Math.max(0, angleRef.current - springbackForce);
                setFinalAngle(actualFinal); setAngle(actualFinal);
            };
            useEffect(() => () => cancelAnimationFrame(requestRef.current), []);

            const evaluate = () => {
                const diff = Math.abs(targetAngle - finalAngle);
                let score, msg;
                if (diff <= 1) { score = 100; msg = 'สมบูรณ์แบบ! ชดเชยค่าสปริงแบ็คได้แม่นยำ ได้มุม 90° พอดี'; }
                else if (diff <= 3) { score = 82; msg = `คลาดเคลื่อนเล็กน้อย (ได้ ${finalAngle.toFixed(1)}°) ยังใช้งานได้`; }
                else {
                    score = Math.max(0, 100 - diff * 10);
                    msg = finalAngle < targetAngle
                        ? `ดัดน้อยไป (ได้ ${finalAngle.toFixed(1)}°) ลืมเผื่อค่าท่อดีดกลับ (Springback ~3°)`
                        : `ดัดมากไป (ได้ ${finalAngle.toFixed(1)}°) ท่อเสียรูปทรง`;
                }
                setResult({ score: Math.floor(score), msg });
            };

            const reset = () => {
                setResult(null); setReleased(false); releasedRef.current = false;
                setBending(false); setAngle(0); setFinalAngle(0); angleRef.current = 0;
            };

            if (result) return <MissionEnd score={result.score} maxScore={100} feedback={result.msg}
                onBack={() => onFinish(result.score, result.msg)} retry={reset} />;

            if (released) return (
                <div className="max-w-md mx-auto p-8 mt-10 bg-slate-800 rounded-xl text-center border border-slate-600">
                    <h2 className="text-2xl font-bold mb-4">ผลลัพธ์การดัดท่อ</h2>
                    <div className="text-6xl font-mono text-emerald-400 mb-2">{finalAngle.toFixed(1)}°</div>
                    <p className="text-slate-400 mb-6">ค่าเป้าหมาย: {targetAngle}° (ท่อดีดกลับ -{springbackForce}°)</p>
                    <button onClick={evaluate} className="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded font-bold">ส่งตรวจชิ้นงาน</button>
                </div>
            );

            return (
                <div className="max-w-3xl mx-auto p-4 sm:p-6 text-center">
                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 mb-8">
                        <h2 className="text-2xl font-bold text-emerald-400 mb-2">ดัดท่อทองแดง (Springback Physics)</h2>
                        <p className="text-slate-300">มุมที่ต้องการ: <span className="font-bold text-white text-xl">{targetAngle}°</span></p>
                        {mode === 'practice' && <p className="text-yellow-400 mt-2 text-sm"><i className="fa-solid fa-lightbulb"></i> ท่อทองแดงเมื่อปล่อยมือจะดีดกลับ (Springback) ~3° ต้องดัดเกินเป้าหมายเล็กน้อย</p>}
                    </div>
                    <div className="relative w-full h-[400px] bg-slate-900 rounded-xl border-2 border-slate-700 flex items-center justify-center mb-8 overflow-hidden shadow-inner">
                        <div className="absolute h-[150px] w-[1px] bg-emerald-500/50 left-1/2 bottom-1/2"></div>
                        <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 text-emerald-500/50 text-sm">90° Target</div>
                        <div className="relative flex w-[500px]">
                            <div className="w-1/2 h-8 bg-gradient-to-b from-orange-300 via-orange-500 to-orange-700 rounded-l-full shadow-md z-10 border-y border-l border-orange-900"></div>
                            <div className="w-1/2 h-8 bg-gradient-to-b from-orange-300 via-orange-500 to-orange-700 rounded-r-full pipe-bend shadow-md z-20 border-y border-r border-orange-900" style={{ transform: `rotate(-${angle}deg)` }}></div>
                            <div className="absolute left-1/2 top-1/2 w-16 h-16 bg-slate-800 rounded-full border-4 border-slate-500 -translate-x-1/2 -translate-y-1/2 z-30 shadow-lg flex items-center justify-center">
                                <div className="w-4 h-4 bg-slate-600 rounded-full"></div>
                            </div>
                        </div>
                        <div className="absolute bottom-6 left-1/2 -translate-x-1/2 text-4xl font-mono font-bold bg-slate-900/80 px-6 py-2 rounded-lg text-white border border-slate-600">{angle.toFixed(1)}°</div>
                    </div>
                    <button onMouseDown={startBending} onMouseUp={stopBending} onMouseLeave={stopBending} onTouchStart={startBending} onTouchEnd={stopBending}
                        className={`w-full py-8 text-2xl font-bold rounded-xl shadow-[0_5px_0_#0f766e] transition-all select-none border border-emerald-400
                        ${bending ? 'bg-emerald-600 translate-y-1 shadow-[0_0_0_#0f766e]' : 'bg-slate-700 hover:bg-slate-600 active:translate-y-1 active:shadow-[0_0_0_#0f766e]'}`}>
                        <i className="fa-solid fa-hand-fist mr-2"></i> {bending ? 'กำลังดัดท่อ (ระวังองศา)...' : 'กดค้างเพื่อออกแรงดัดท่อ (Hold)'}
                    </button>
                </div>
            );
        };

        /* ============================================================
           MINI-GAME 4 (ใหม่) — เดินท่อน้ำยา (Refrigerant Piping)
           อ้างอิงผัง images (1) — อุปกรณ์ "สลับตำแหน่ง" ทุกครั้ง ผู้เรียนต้องรู้ทิศทางการไหลเอง
        ============================================================ */
        const pipeShuffle = (a) => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
        // ช่องวาง 5 ตำแหน่ง — ตาราง 3 บน / 2 ล่าง เว้นระยะไม่ชนกัน (ไม่เรียงเป็นวงกลม)
        const PIPE_SLOTS = [
            { x: 3,  y: 5,  w: 27, h: 28 },   // แถวบน ซ้าย
            { x: 36, y: 5,  w: 28, h: 28 },   // แถวบน กลาง
            { x: 70, y: 5,  w: 27, h: 28 },   // แถวบน ขวา
            { x: 12, y: 52, w: 31, h: 34 },   // แถวล่าง ซ้าย
            { x: 57, y: 52, w: 33, h: 34 }    // แถวล่าง ขวา
        ];
        // อุปกรณ์ 5 ตัว + จุดต่อ — ทุกกล่องวางเหมือนกัน: "เข้า" ซ้าย (dx 0.32) · "ออก" ขวา (dx 0.68) · แถวเดียวกัน (dy 0.68)
        const PIPE_COMPS = [
            { key: 'COMP', name: 'คอมเพรสเซอร์', tint: 'slate', round: true, terms: [
                { id: 'COMP_S', label: 'ท่อดูด (เข้า)', dx: 0.32, dy: 0.68 },
                { id: 'COMP_D', label: 'ท่ออัด (ออก)', dx: 0.68, dy: 0.68 } ] },
            { key: 'CON', name: 'แผงระบายความร้อน (คอยล์ร้อน)', tint: 'red', terms: [
                { id: 'CON_I', label: 'เข้า', dx: 0.32, dy: 0.68 },
                { id: 'CON_O', label: 'ออก', dx: 0.68, dy: 0.68 } ] },
            { key: 'DRY', name: 'ฟิลเตอร์-ดรายเออร์', tint: 'yellow', terms: [
                { id: 'DRY_I', label: 'เข้า', dx: 0.32, dy: 0.68 },
                { id: 'DRY_O', label: 'ออก', dx: 0.68, dy: 0.68 } ] },
            { key: 'CAP', name: 'แคปทิ้ว', tint: 'slate', terms: [
                { id: 'CAP_I', label: 'เข้า', dx: 0.32, dy: 0.68 },
                { id: 'CAP_O', label: 'ออก', dx: 0.68, dy: 0.68 } ] },
            { key: 'EVA', name: 'แผงอีแวปเปอเรเตอร์ (คอยล์เย็น)', tint: 'sky', terms: [
                { id: 'EVA_I', label: 'เข้า', dx: 0.32, dy: 0.68 },
                { id: 'EVA_O', label: 'ออก', dx: 0.68, dy: 0.68 } ] }
        ];
        const PIPE_TINT = {
            slate:  'border-slate-500 bg-slate-800/40 text-slate-300',
            red:    'border-red-500/60 bg-red-500/5 text-red-300/90',
            yellow: 'border-yellow-500/60 bg-yellow-500/5 text-yellow-300/90',
            sky:    'border-sky-500/60 bg-sky-500/5 text-sky-300/90'
        };
        const PIPE_CORRECT = [
            ['COMP_D', 'CON_I'],   // ท่ออัด (แก๊สร้อนความดันสูง) เข้าคอยล์ร้อน
            ['CON_O', 'DRY_I'],    // ของเหลว ออกคอยล์ร้อน เข้าฟิลเตอร์-ดรายเออร์
            ['DRY_O', 'CAP_I'],    // ของเหลว เข้าแคปทิ้ว
            ['CAP_O', 'EVA_I'],    // หลังลดความดัน เข้าคอยล์เย็น
            ['EVA_O', 'COMP_S']    // ท่อดูด (แก๊สเย็นความดันต่ำ) กลับคอมเพรสเซอร์
        ];
        const PIPE_FULLNAME = {
            COMP_D: 'คอมเพรสเซอร์ (ท่ออัด)', COMP_S: 'คอมเพรสเซอร์ (ท่อดูด)',
            CON_I: 'คอยล์ร้อน เข้า', CON_O: 'คอยล์ร้อน ออก',
            DRY_I: 'ฟิลเตอร์-ดรายเออร์ เข้า', DRY_O: 'ฟิลเตอร์-ดรายเออร์ ออก',
            CAP_I: 'แคปทิ้ว เข้า', CAP_O: 'แคปทิ้ว ออก',
            EVA_I: 'คอยล์เย็น เข้า', EVA_O: 'คอยล์เย็น ออก'
        };
        const PIPE_MSG = {
            'COMP_D|CON_I': 'ยังไม่ได้ต่อท่ออัดจากคอมเพรสเซอร์ไปคอยล์ร้อน',
            'CON_O|DRY_I': 'คอยล์ร้อนยังไม่ได้ต่อไปฟิลเตอร์-ดรายเออร์',
            'CAP_I|DRY_O': 'ฟิลเตอร์-ดรายเออร์ยังไม่ได้ต่อไปแคปทิ้ว',
            'CAP_O|EVA_I': 'แคปทิ้วยังไม่ได้ต่อไปคอยล์เย็น',
            'COMP_S|EVA_O': 'ยังไม่ได้ต่อท่อดูดจากคอยล์เย็นกลับคอมเพรสเซอร์'
        };

        const PIPE_NODE_IDS = ['COMP_S', 'COMP_D', 'CON_I', 'CON_O', 'DRY_I', 'DRY_O', 'CAP_I', 'CAP_O', 'EVA_I', 'EVA_O'];

        const GamePiping = ({ mode, onFinish, pipeKey }) => {
            const correctPairs = (Array.isArray(pipeKey) && pipeKey.length) ? pipeKey : PIPE_CORRECT;
            const akCustom = JSON.stringify(correctPairs) !== JSON.stringify(PIPE_CORRECT);
            const [connections, setConnections] = useState([]);
            const [draft, setDraft] = useState(null);
            const [mouse, setMouse] = useState(null);
            const [wireSel, setWireSel] = useState(null);
            const [junctions, setJunctions] = useState([]);
            const [result, setResult] = useState(null);
            const [round, setRound] = useState(0);
            // สลับตำแหน่งอุปกรณ์เข้าช่องวางแบบสุ่ม (สุ่มใหม่ทุกครั้งที่เริ่มรอบใหม่)
            const layout = React.useMemo(() => {
                const perm = pipeShuffle(PIPE_SLOTS.map((_, i) => i));
                return PIPE_COMPS.map((comp, i) => ({ comp, slot: PIPE_SLOTS[perm[i]] }));
            }, [round]);
            const nodes = React.useMemo(() => {
                const n = {};
                layout.forEach(({ comp, slot }) => comp.terms.forEach(t => {
                    const y = slot.y + slot.h * t.dy;
                    n[t.id] = { label: t.label, x: slot.x + slot.w * t.dx, y, up: y > 84 };
                }));
                return n;
            }, [layout]);
            const uid = () => Math.random().toString(36).slice(2, 9);
            const jkey = (a, b) => [a, b].sort().join('~');
            const isJ = (a, b) => junctions.includes(jkey(a, b));

            const toVB = (e) => {
                const svg = e.currentTarget.ownerSVGElement || e.currentTarget;
