                const r = svg.getBoundingClientRect();
                const pt = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
                return [Math.round(((pt.clientX - r.left) / r.width) * 200) / 2,
                        Math.round(((pt.clientY - r.top) / r.height) * 200) / 2];
            };
            const handleNodeClick = (id) => {
                if (result) return;
                if (!draft) { setDraft({ from: id, points: [] }); setWireSel(null); setMouse(null); return; }
                if (id === draft.from) { setDraft(null); setMouse(null); return; }
                setConnections(cs => [...cs, { id: uid(), a: draft.from, b: id, waypoints: draft.points }]);
                setDraft(null); setMouse(null);
            };
            const cancelDraft = () => { setDraft(null); setMouse(null); };
            const undoPoint = () => setDraft(d => (d && d.points.length) ? { ...d, points: d.points.slice(0, -1) } : d);
            useEffect(() => {
                const onKey = (e) => {
                    if (e.key === 'Escape') cancelDraft();
                    if (e.key === 'Backspace' && draft) { e.preventDefault(); undoPoint(); }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [draft]);
            const delWire = (id) => {
                setConnections(cs => cs.filter(c => c.id !== id));
                setJunctions(js => js.filter(k => !k.split('~').includes(id)));
                setWireSel(null);
            };

            const routes = React.useMemo(() => connections.map(c => {
                const A = nodes[c.a];
                if (!A) return null;
                let end, anchor;
                if (c.b) { const B = nodes[c.b]; if (!B) return null; end = [B.x, B.y]; anchor = c.b; }
                else { const tc = connections.find(x => x.id === c.tapWire); if (!tc) return null; end = c.tapPt; anchor = tc.a; }
                const pts = [[A.x, A.y], ...(c.waypoints || []), end];
                const segs = [];
                for (let k = 0; k < pts.length - 1; k++) segs.push([pts[k], pts[k + 1]]);
                return { id: c.id, a: c.a, b: anchor, tap: c.b ? null : c.tapPt, pts, segs, wp: c.waypoints || [] };
            }).filter(Boolean), [connections]);

            const crossings = React.useMemo(() => {
                const out = [];
                for (let i = 0; i < routes.length; i++) for (let j = i + 1; j < routes.length; j++) {
                    const ri = routes[i], rj = routes[j];
                    if (ri.a === rj.a || ri.a === rj.b || ri.b === rj.a || ri.b === rj.b) continue;
                    for (const si of ri.segs) for (const sj of rj.segs) {
                        const p = segCross(si[0], si[1], sj[0], sj[1]);
                        if (p) out.push({ x: p[0], y: p[1], a: ri.id, b: rj.id, over: j, overSeg: sj });
                    }
                }
                return out;
            }, [routes]);

            const jEdges = junctions.map(k => {
                const [i1, i2] = k.split('~');
                const c1 = connections.find(c => c.id === i1), c2 = connections.find(c => c.id === i2);
                return (c1 && c2) ? [c1.a, c2.a] : null;
            }).filter(Boolean);
            const adj = connections.map(c => {
                if (c.b) return [c.a, c.b];
                const tc = connections.find(x => x.id === c.tapWire);
                return tc ? [c.a, tc.a] : null;
            }).filter(Boolean).concat(jEdges);
            const hiNet = bfsNet(adj, 'COMP_D');
            const loNet = bfsNet(adj, 'COMP_S');
            const colorOf = (na, nb) => (hiNet.has(na) && hiNet.has(nb)) ? '#ef4444'
                : (loNet.has(na) && loNet.has(nb)) ? '#3b82f6' : '#94a3b8';

            const svgMove = (e) => { if (draft) setMouse(toVB(e)); };
            const svgClick = (e) => {
                const [x, y] = toVB(e);
                if (draft) { setDraft(d => ({ ...d, points: [...d.points, [x, y]] })); return; }
                const near = crossings.find(cr => Math.hypot(cr.x - x, cr.y - y) < 3);
                if (near) {
                    const k = jkey(near.a, near.b);
                    setJunctions(js => js.includes(k) ? js.filter(z => z !== k) : [...js, k]);
                } else setWireSel(null);
            };
            const wireClick = (e, r) => {
                e.stopPropagation();
                if (draft) {
                    const [x, y] = toVB(e);
                    setConnections(cs => [...cs, { id: uid(), a: draft.from, b: null, tapWire: r.id, tapPt: [x, y], waypoints: draft.points }]);
                    setDraft(null); setMouse(null);
                    return;
                }
                setWireSel(prev => prev === r.id ? null : r.id);
            };

            const checkPiping = () => {
                const has = (a, b) => connections.some(c => (c.a === a && c.b === b) || (c.b === a && c.a === b));
                const conn = (a, b) => bfsNet(adj, a).has(b);
                if (conn('COMP_D', 'COMP_S')) {
                    setResult({ score: 0, msg: '💥 ลัดวงจรน้ำยา! ต่อท่ออัดกับท่อดูดถึงกันโดยตรง คอมเพรสเซอร์อัดน้ำยาไม่ขึ้น' });
                    return;
                }
                let s = 100; const msgs = [];
                const pen = Math.max(8, Math.round(100 / Math.max(1, correctPairs.length)));
                correctPairs.forEach(([a, b]) => {
                    if (!has(a, b) && !conn(a, b)) {
                        s -= pen;
                        msgs.push(PIPE_MSG[pairKey(a, b)] || `ยังไม่ได้ต่อท่อ: ${PIPE_FULLNAME[a] || a} ↔ ${PIPE_FULLNAME[b] || b}`);
                    }
                });
                if (has('COMP_D', 'DRY_I') || has('COMP_D', 'CAP_I') || has('COMP_D', 'EVA_I')) {
                    s -= 15; msgs.push('⚠️ ท่อจากคอมเพรสเซอร์ต้องเข้าคอยล์ร้อนก่อน ห้ามข้ามไปดรายเออร์/แคปทิ้ว/คอยล์เย็น');
                }
                if (has('CON_O', 'CAP_I')) {
                    s -= 12; msgs.push('⚠️ ไม่ผ่านฟิลเตอร์-ดรายเออร์ — ความชื้นและผงจะไปอุดตันแคปทิ้ว');
                }
                if (has('DRY_O', 'EVA_I') || has('CON_O', 'EVA_I')) {
                    s -= 10; msgs.push('⚠️ ไม่ผ่านแคปทิ้ว — น้ำยาไม่ถูกลดความดันก่อนเข้าคอยล์เย็น');
                }
                if (has('EVA_O', 'CON_I') || has('EVA_O', 'DRY_I') || has('EVA_O', 'CAP_I')) {
                    s -= 10; msgs.push('⚠️ ต่อผิดทิศ — น้ำยาจากคอยล์เย็นต้องกลับเข้าท่อดูดของคอมเพรสเซอร์');
                }
                s = Math.max(0, Math.round(s));
                setResult({
                    score: s,
                    msg: msgs.length ? msgs.join(' · ')
                        : 'ครบวงจร! น้ำยาไหล คอมเพรสเซอร์ → คอยล์ร้อน (ควบแน่นเป็นของเหลว) → ฟิลเตอร์-ดรายเออร์ → แคปทิ้ว (ลดความดัน) → คอยล์เย็น (ระเหยดูดความร้อน) → กลับคอมเพรสเซอร์'
                });
            };

            if (result) return <MissionEnd score={result.score} maxScore={100} feedback={result.msg}
                onBack={() => onFinish(result.score, result.msg)} retry={() => { setResult(null); setConnections([]); setDraft(null); setMouse(null); setWireSel(null); setJunctions([]); setRound(r => r + 1); }} />;

            const selRoute = routes.find(r => r.id === wireSel);
            const dFrom = draft ? nodes[draft.from] : null;
            const draftPath = draft ? [[dFrom.x, dFrom.y], ...draft.points, ...(mouse ? [mouse] : [])] : null;

            return (
                <div className="max-w-5xl mx-auto p-4 sm:p-6">
                    <h2 className="text-2xl font-bold text-yellow-400 mb-2">เดินท่อน้ำยา (วงจรทำความเย็น) — อุปกรณ์สลับตำแหน่ง</h2>
                    {akCustom && <p className="mb-1 text-xs text-yellow-300 bg-yellow-900/20 border border-yellow-700/40 rounded px-2 py-1 inline-block"><i className="fa-solid fa-user-pen mr-1"></i> เฉลยการเดินท่อด่านนี้ถูกปรับแต่งโดยผู้สอน</p>}
                    <p className="text-slate-300 mb-1 text-sm">คลิก “จุดต่อท่อ” เพื่อเริ่มเดินท่อ → คลิก “พื้นที่ว่าง” เพื่อหักมุมนำท่อหลบเส้นอื่น (เห็นท่อก่อนวาง) → คลิกจุดต่อปลายทางเพื่อจบ · ESC / คลิกขวา = ยกเลิก · คลิกที่ท่อ = เลือก/ลบ · แตะจุดที่ท่อตัดกัน = สลับ ยกข้าม ↔ จุดจั๊ม · ต่อให้ครบวงจร: คอมเพรสเซอร์ → คอยล์ร้อน → ดรายเออร์ → แคปทิ้ว → คอยล์เย็น → กลับคอมเพรสเซอร์</p>
                    <div className="flex flex-wrap gap-x-4 gap-y-1 mb-2 text-xs text-slate-400">
                        <span>ต่อแล้ว {connections.length} เส้น</span>
                        <span><span className="inline-block w-4 h-1 rounded bg-red-500 align-middle mr-1"></span> ด้านความดันสูง (ท่ออัด/ของเหลว)</span>
                        <span><span className="inline-block w-4 h-1 rounded bg-blue-500 align-middle mr-1"></span> ด้านความดันต่ำ (ท่อดูด)</span>
                        <span><span className="inline-block w-4 h-1 rounded bg-slate-400 align-middle mr-1"></span> ยังไม่ครบวงจร</span>
                    </div>
                    {draft && (
                        <div className="flex items-center justify-between gap-2 mb-2 bg-slate-800 border border-yellow-500/60 rounded-lg px-3 py-2 text-sm animate-fade-in">
                            <span className="text-yellow-200"><i className="fa-solid fa-pen-nib mr-2"></i> กำลังเดินท่อจาก “{PIPE_FULLNAME[draft.from] || draft.from}” · หักมุมแล้ว {draft.points.length} จุด — คลิกจุดต่อปลายทางเพื่อจบ</span>
                            <span className="flex gap-2 shrink-0">
                                <button onClick={undoPoint} disabled={!draft.points.length} className="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-xs"><i className="fa-solid fa-rotate-left mr-1"></i>ถอยจุด</button>
                                <button onClick={cancelDraft} className="px-2 py-1 rounded bg-red-600 hover:bg-red-500 text-white text-xs"><i className="fa-solid fa-xmark mr-1"></i>ยกเลิก</button>
                            </span>
                        </div>
                    )}
                    {!draft && selRoute && (
                        <div className="flex items-center justify-between gap-2 mb-2 bg-slate-800 border border-yellow-500/50 rounded-lg px-3 py-2 text-sm">
                            <span className="text-slate-200"><i className="fa-solid fa-wave-square mr-2 text-yellow-400"></i> ท่อที่เลือก: {PIPE_FULLNAME[selRoute.a] || selRoute.a} <i className="fa-solid fa-arrows-left-right mx-1 text-slate-500"></i> {selRoute.tap ? 'จุดจั๊มบนท่ออื่น' : (PIPE_FULLNAME[selRoute.b] || selRoute.b)}</span>
                            <button onClick={() => delWire(selRoute.id)} className="shrink-0 px-3 py-1 rounded bg-red-600 hover:bg-red-500 text-white text-xs font-semibold"><i className="fa-solid fa-trash mr-1"></i> ลบท่อนี้</button>
                        </div>
                    )}

                    <div className="hscroll -mx-2 sm:mx-0">
                    <div className="relative w-full min-w-[580px] h-[440px] sm:h-[600px] bg-slate-900 rounded-xl border border-slate-600 p-3 sm:p-4 shadow-inner overflow-hidden select-none"
                         onContextMenu={(e) => { e.preventDefault(); cancelDraft(); }}>
                        <svg className={`absolute top-0 left-0 w-full h-full z-10 ${draft ? 'cursor-crosshair' : ''}`} viewBox="0 0 100 100" preserveAspectRatio="none" onClick={svgClick} onMouseMove={svgMove} onTouchMove={svgMove}>
                            {routes.map(r => {
                                const col = colorOf(r.a, r.b);
                                const sel = wireSel === r.id;
                                const dim = wireSel && !sel;
                                const d = 'M ' + r.pts.map(p => p.join(' ')).join(' L ');
                                return <path key={'w' + r.id} d={d} fill="none" stroke={col} strokeWidth={sel ? 6 : 3.5} strokeLinecap="round" strokeLinejoin="round" opacity={dim ? 0.25 : 0.95} vectorEffect="non-scaling-stroke" pointerEvents="none" />;
                            })}
                            {selRoute && selRoute.wp.map((p, k) => <circle key={'wp' + k} cx={p[0]} cy={p[1]} r="1.5" fill="#facc15" pointerEvents="none" />)}
                            {crossings.filter(cr => !isJ(cr.a, cr.b)).map((cr, k) => (
                                <circle key={'g' + k} cx={cr.x} cy={cr.y} r="2.3" fill="#0f172a" pointerEvents="none" />
                            ))}
                            {crossings.filter(cr => !isJ(cr.a, cr.b)).map((cr, k) => {
                                const over = routes[cr.over];
                                if (!over) return null;
                                const [q1, q2] = cr.overSeg;
                                let ux = q2[0] - q1[0], uy = q2[1] - q1[1];
                                const L = Math.hypot(ux, uy) || 1; ux /= L; uy /= L;
                                const rr = 2.7;
                                const a1 = [cr.x - ux * rr, cr.y - uy * rr], a2 = [cr.x + ux * rr, cr.y + uy * rr];
                                const cp = [cr.x - uy * rr * 1.7, cr.y + ux * rr * 1.7];
                                const col = colorOf(over.a, over.b);
                                return <path key={'hop' + k} d={`M ${a1[0]} ${a1[1]} Q ${cp[0]} ${cp[1]} ${a2[0]} ${a2[1]}`} fill="none" stroke={col} strokeWidth="3.5" strokeLinecap="round" vectorEffect="non-scaling-stroke" pointerEvents="none" />;
                            })}
                            {crossings.filter(cr => isJ(cr.a, cr.b)).map((cr, k) => (
                                <circle key={'j' + k} cx={cr.x} cy={cr.y} r="1" fill="#fbbf24" stroke="#0f172a" strokeWidth="0.3" pointerEvents="none" />
                            ))}
                            {routes.filter(r => r.tap).map(r => (
                                <circle key={'tap' + r.id} cx={r.tap[0]} cy={r.tap[1]} r="1" fill="#fbbf24" stroke="#0f172a" strokeWidth="0.3" pointerEvents="none" />
                            ))}
                            {draftPath && draftPath.length > 1 &&
                                <path d={'M ' + draftPath.map(p => p.join(' ')).join(' L ')} fill="none" stroke="#fde047" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="3 2" opacity="0.9" vectorEffect="non-scaling-stroke" pointerEvents="none" />}
                            {draft && draft.points.map((p, k) => <circle key={'dp' + k} cx={p[0]} cy={p[1]} r="1.4" fill="#fde047" pointerEvents="none" />)}
                            {routes.map(r => {
                                const d = 'M ' + r.pts.map(p => p.join(' ')).join(' L ');
                                return <path key={'hit' + r.id} d={d} fill="none" stroke="transparent" strokeWidth="14" vectorEffect="non-scaling-stroke" style={{ cursor: 'pointer' }} onClick={(e) => wireClick(e, r)} />;
                            })}
                        </svg>

                        {/* กรอบอุปกรณ์ — สลับตำแหน่งแบบสุ่ม */}
                        {layout.map(({ comp, slot }) => (
                            <div key={comp.key}
                                className={`absolute ${comp.round ? 'rounded-full border-4' : 'rounded-lg border-2'} pointer-events-none flex items-start justify-center pt-1.5 text-[10px] font-semibold text-center px-1 ${PIPE_TINT[comp.tint]}`}
                                style={{ left: `${slot.x}%`, top: `${slot.y}%`, width: `${slot.w}%`, height: `${slot.h}%` }}>
                                {comp.name}
                            </div>
                        ))}

                        {Object.entries(nodes).map(([id, node]) => {
                            const isFrom = draft && draft.from === id;
                            const canEnd = draft && draft.from !== id;
                            const tint = id === 'COMP_D' ? 'border-red-500' : id === 'COMP_S' ? 'border-blue-500' : 'border-slate-400';
                            return (
                            <div key={id} onClick={() => handleNodeClick(id)}
                                className="absolute transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center cursor-pointer z-20 group"
                                style={{ left: `${node.x}%`, top: `${node.y}%` }}>
                                <div className={`w-8 h-8 rounded-full border-4 flex items-center justify-center transition-all shadow-lg
                                    ${isFrom
                                        ? 'bg-yellow-400 border-white scale-125 ring-4 ring-yellow-500/50'
                                        : `bg-slate-700 group-hover:border-yellow-400 group-hover:scale-110 ${canEnd ? 'ring-2 ring-yellow-400/40 ' : ''}${tint}`}`}>
                                    <div className="w-1.5 h-1.5 bg-slate-900 rounded-full"></div>
                                </div>
                                <span className={`absolute ${node.up ? 'bottom-9' : 'top-9'} px-1.5 py-0.5 rounded text-[10px] font-bold whitespace-nowrap border ${isFrom ? 'bg-yellow-500 text-black border-yellow-400' : 'bg-slate-800 text-slate-300 border-slate-600'}`}>{node.label}</span>
                            </div>
                            );
                        })}
                    </div>
                    </div>

                    {mode === 'practice' && <p className="text-yellow-400 text-xs mt-3"><i className="fa-solid fa-lightbulb"></i> ทิศทางการไหล: คอมเพรสเซอร์ (ท่ออัด) → คอยล์ร้อน → ฟิลเตอร์-ดรายเออร์ → แคปทิ้ว → คอยล์เย็น → คอมเพรสเซอร์ (ท่อดูด) · ห้ามข้ามดรายเออร์หรือแคปทิ้ว · ท่อ “เข้า” ต่อกับ “ออก” ของอุปกรณ์ก่อนหน้า</p>}

                    <button onClick={checkPiping} className="w-full py-4 mt-5 bg-yellow-600 hover:bg-yellow-500 text-xl font-bold rounded-xl shadow-lg transition-colors text-black">
                        <i className="fa-solid fa-fill-drip mr-2"></i> เดินน้ำยาทดสอบวงจร
                    </button>
                </div>
            );
        };

        /* ============================================================
           MINI-GAME 5 — ทำสุญญากาศ (ต่อสายเกจ + ดึงแวคคั่มให้พอดี -30 นิ้วปรอท)
           อ้างอิงผัง ไม่มีชื่อ.png : สายฟ้า=Low · สายกลาง(เหลือง)=ปั๊มแวคคั่ม · สายแดง=High
        ============================================================ */
        const GameVacuum = ({ mode, onFinish, vacKey }) => {
            const target = (vacKey && typeof vacKey.target === 'number') ? vacKey.target : -30;
            const akCustom = target !== -30;
            const [phase, setPhase] = useState('hookup');     // hookup | pull
            const [conns, setConns] = useState([]);           // [[a,b]]
            const [sel, setSel] = useState(null);
            const [hookMsg, setHookMsg] = useState('');
            const [pumpOn, setPumpOn] = useState(false);
            const [valveOpen, setValveOpen] = useState(false);
            const [reading, setReading] = useState(0);
            const [result, setResult] = useState(null);
            const rRef = useRef(0);

            const NODES = {
                MAN_L: { label: 'พอร์ตเกจ Low', x: 27, y: 22, dot: '#3b82f6' },   // เกจมาตรฐาน: Low = น้ำเงิน
                MAN_C: { label: 'พอร์ตเกจ กลาง', x: 45, y: 22, dot: '#eab308' },   // กลาง (Service) = เหลือง
                MAN_H: { label: 'พอร์ตเกจ High', x: 63, y: 22, dot: '#ef4444' },   // High = แดง
                SYS_L: { label: 'เซอร์วิสวาล์ว Low (ด้านดูด)', x: 16, y: 84 },
                VAC:   { label: 'ปั๊มแวคคั่ม', x: 45, y: 64 },
                SYS_H: { label: 'เซอร์วิสวาล์ว High (ด้านอัด)', x: 84, y: 84 }
            };
            const CORRECT = [['MAN_L', 'SYS_L'], ['MAN_C', 'VAC'], ['MAN_H', 'SYS_H']];
            const has = (a, b) => conns.some(c => (c[0] === a && c[1] === b) || (c[1] === a && c[0] === b));
            // สายอ่อนต่อจากพอร์ตเกจ = สีตามพอร์ตนั้น (ฟ้า/เหลือง/แดง ตามมาตรฐาน)
            const hoseColor = (a, b) => {
                const m = a.startsWith('MAN') ? a : (b.startsWith('MAN') ? b : null);
                return NODES[m]?.dot || '#94a3b8';
            };
            const clickNode = (id) => {
                if (!sel) { setSel(id); return; }
                if (sel === id) { setSel(null); return; }
                const onePort = (sel.startsWith('MAN')) !== (id.startsWith('MAN'));  // ต้องมีพอร์ตเกจฝั่งเดียว
                if (onePort) {
                    const idx = conns.findIndex(c => (c[0] === sel && c[1] === id) || (c[1] === sel && c[0] === id));
                    if (idx >= 0) setConns(conns.filter((_, i) => i !== idx));
                    else setConns([...conns.filter(c => !c.includes(sel) && !c.includes(id)), [sel, id]]);
                }
                setSel(null);
            };
            const confirmHookup = () => {
                const missing = CORRECT.filter(([a, b]) => !has(a, b));
                const wrong = conns.filter(c => !CORRECT.some(([a, b]) => (a === c[0] && b === c[1]) || (a === c[1] && b === c[0])));
                if (!missing.length && !wrong.length) { setPhase('pull'); setHookMsg(''); return; }
                const m = [];
                if (has('MAN_L', 'SYS_H') || has('MAN_H', 'SYS_L')) m.push('สลับสายฟ้า/แดง — สายฟ้า (Low) ต่อเซอร์วิสวาล์วด้าน Low, สายแดง (High) ต่อด้าน High');
                if (has('MAN_C', 'SYS_L') || has('MAN_C', 'SYS_H')) m.push('สายกลาง (เหลือง) ต้องต่อเข้าปั๊มแวคคั่ม ไม่ใช่เข้าเซอร์วิสวาล์วของระบบ');
                if (has('MAN_L', 'VAC') || has('MAN_H', 'VAC')) m.push('ปั๊มแวคคั่มต้องต่อกับพอร์ตกลางของเกจเท่านั้น');
                if (!m.length) m.push(`ต่อสายยังไม่ครบ/ไม่ถูก (ขาด ${missing.length} เส้น)`);
                setHookMsg(m.join(' · '));
            };

            useEffect(() => {
                if (phase !== 'pull' || !pumpOn || !valveOpen || result) return;
                const iv = setInterval(() => {
                    rRef.current = Math.max(-50, rRef.current - 0.2);
                    setReading(rRef.current);
                    if (rRef.current <= -50) clearInterval(iv);
                }, 90);
                return () => clearInterval(iv);
            }, [phase, pumpOn, valveOpen, result]);

            useEffect(() => {
                if (phase === 'pull' && reading <= -50 && !result) {
                    setResult({ score: 20, msg: 'ไม่ได้กดหยุด — ปล่อยให้ปั๊มดึงจนเข็มตกสุดสเกล (-50 นิ้วปรอท)' });
                }
            }, [reading, phase, result]);

            const doStop = () => {
                if (result) return;
                if (!pumpOn || !valveOpen) { setResult({ score: 20, msg: 'ยังไม่ได้เปิดปั๊มแวคคั่มและวาล์วเกจ เข็มยังไม่เดิน' }); return; }
                const r = rRef.current;
                const diff = Math.abs(r - target);
                let score, msg;
                if (r > target + 6) { score = 40; msg = `หยุดเร็วไป เข็มเพิ่งถึง ${r.toFixed(1)} นิ้วปรอท ยังไม่ถึงค่าสุญญากาศที่กำหนด`; }
                else if (r < target - 0.6) { score = Math.max(0, Math.round(100 - diff * 10)); msg = `หยุดช้าไป ดึงเลยเป้าหมายไปที่ ${r.toFixed(1)} นิ้วปรอท`; }
                else if (diff <= 0.3) { score = 100; msg = `เยี่ยม! หยุดที่ ${r.toFixed(1)} นิ้วปรอท พอดีตามมาตรฐาน (สุญญากาศสมบูรณ์)`; }
                else if (diff <= 1) { score = 90; msg = `เกือบพอดี — หยุดที่ ${r.toFixed(1)} นิ้วปรอท`; }
                else if (diff <= 2) { score = 80; msg = `ใช้ได้ — หยุดที่ ${r.toFixed(1)} นิ้วปรอท (คลาด ${diff.toFixed(1)})`; }
                else { score = 70; msg = `หยุดที่ ${r.toFixed(1)} นิ้วปรอท คลาดจากเป้าหมาย ${diff.toFixed(1)}`; }
                setResult({ score, msg });
            };

            const reset = () => {
                setResult(null); setPhase('hookup'); setConns([]); setSel(null); setHookMsg('');
                setPumpOn(false); setValveOpen(false); setReading(0); rRef.current = 0;
            };

            if (result) return <MissionEnd score={result.score} maxScore={100} feedback={result.msg}
                onBack={() => onFinish(result.score, result.msg)} retry={reset} />;

            if (phase === 'hookup') {
                return (
                    <div className="max-w-4xl mx-auto p-4 sm:p-6">
                        <h2 className="text-2xl font-bold text-blue-400 mb-1">ทำสุญญากาศ — ขั้นที่ 1: ต่อสายเกจ</h2>
                        <p className="text-slate-300 text-sm mb-2">ต่อชุดเกจแมนิโฟลด์เข้ากับปั๊มแวคคั่มและเครื่องทำความเย็นให้ครบ 3 เส้นอย่างถูกต้อง — คลิกจุดต่อ 2 จุดเพื่อโยงสาย (คลิกซ้ำที่คู่เดิมเพื่อลบ)</p>
                        {akCustom && <p className="text-xs text-yellow-300 bg-yellow-900/20 border border-yellow-700/40 rounded px-2 py-1 inline-block mb-2"><i className="fa-solid fa-user-pen mr-1"></i> ค่าสุญญากาศเป้าหมายด่านนี้ถูกปรับแต่งโดยผู้สอน</p>}
                        <div className="flex flex-wrap gap-x-4 gap-y-1 mb-2 text-xs text-slate-400">
                            <span>ต่อแล้ว {conns.length}/3 เส้น</span>
                            <span className="text-slate-500">พอร์ตเกจมาตรฐาน:</span>
                            <span><span className="inline-block w-3 h-3 rounded-full bg-blue-500 align-middle mr-1"></span> Low</span>
                            <span><span className="inline-block w-3 h-3 rounded-full bg-yellow-500 align-middle mr-1"></span> กลาง (Service)</span>
                            <span><span className="inline-block w-3 h-3 rounded-full bg-red-500 align-middle mr-1"></span> High</span>
                        </div>
                        {hookMsg && <div className="bg-red-900/30 border border-red-500/50 rounded-lg px-3 py-2 text-sm text-red-300 mb-2"><i className="fa-solid fa-triangle-exclamation mr-2"></i>{hookMsg}</div>}

                        <div className="hscroll -mx-2 sm:mx-0">
                        <div className="relative w-full min-w-[440px] h-[400px] sm:h-[520px] bg-slate-900 rounded-xl border border-slate-600 p-3 sm:p-4 shadow-inner overflow-hidden select-none">
                            <svg className="absolute inset-0 w-full h-full z-10 pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
                                {conns.map((c, i) => {
                                    const a = NODES[c[0]], b = NODES[c[1]];
                                    const my = (a.y + b.y) / 2;
                                    return <path key={i} d={`M ${a.x} ${a.y} C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y}`} fill="none" stroke={hoseColor(c[0], c[1])} strokeWidth="4" strokeLinecap="round" vectorEffect="non-scaling-stroke" opacity="0.95" />;
                                })}
                            </svg>
                            <div className="absolute left-[18%] top-[6%] w-[54%] h-[26%] border-2 border-slate-600 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-300">ชุดเกจแมนิโฟลด์</div>
                            <div className="absolute left-[35%] top-[50%] w-[20%] h-[24%] border-2 border-slate-600 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-300">ปั๊มแวคคั่ม</div>
                            <div className="absolute left-[3%] top-[76%] w-[94%] h-[22%] border-2 border-slate-600 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-300">เครื่องทำความเย็น</div>

                            {Object.entries(NODES).map(([id, n]) => (
                                <div key={id} onClick={() => clickNode(id)}
                                    className="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center cursor-pointer z-20"
                                    style={{ left: `${n.x}%`, top: `${n.y}%` }}>
                                    <div className="w-8 h-8 rounded-full border-4 flex items-center justify-center shadow-lg transition-all"
                                        style={{ borderColor: sel === id ? '#ffffff' : (n.dot || '#64748b'), background: sel === id ? '#facc15' : '#334155', transform: sel === id ? 'scale(1.2)' : 'scale(1)' }}>
                                        <div className="w-1.5 h-1.5 rounded-full bg-slate-900"></div>
                                    </div>
                                    <span className="absolute top-9 px-1.5 py-0.5 rounded text-[10px] font-bold whitespace-nowrap border bg-slate-800 text-slate-300 border-slate-600">{n.label}</span>
                                </div>
                            ))}
                        </div>
                        </div>

                        {mode === 'practice' && <p className="text-yellow-400 text-xs mt-3"><i className="fa-solid fa-lightbulb"></i> มาตรฐาน: สายฟ้า = พอร์ตเกจ Low → เซอร์วิสวาล์วด้านดูด · สายกลาง (เหลือง) = พอร์ตเกจกลาง → ปั๊มแวคคั่ม · สายแดง = พอร์ตเกจ High → เซอร์วิสวาล์วด้านอัด</p>}
                        <button onClick={confirmHookup} className="w-full py-4 mt-4 bg-blue-600 hover:bg-blue-500 text-xl font-bold rounded-xl shadow-lg transition-colors">
                            <i className="fa-solid fa-plug-circle-check mr-2"></i> ยืนยันการต่อสาย → ไปขั้นตอนถัดไป
                        </button>
                    </div>
                );
            }

            // ---------- PHASE 2 : PULL VACUUM ----------
            const pct = Math.min(100, Math.max(0, (reading / -50) * 100));
            return (
                <div className="max-w-3xl mx-auto p-4 sm:p-6">
                    <h2 className="text-2xl font-bold text-blue-400 mb-1">ทำสุญญากาศ — ขั้นที่ 2: ดึงแวคคั่ม</h2>
                    <p className="text-slate-300 text-sm mb-4">เปิดปั๊มแวคคั่ม → เปิดวาล์วเกจ → รอเข็มไล่ลงช้าๆ แล้ว <span className="text-yellow-300 font-semibold">กด “หยุด” เมื่อได้ค่าสุญญากาศตามมาตรฐาน</span></p>

                    <div className="bg-slate-900 rounded-2xl border-2 border-slate-700 p-6 mb-4 shadow-inner">
                        <div className="text-center text-slate-400 text-xs font-bold tracking-widest mb-2">COMPOUND GAUGE — สุญญากาศ</div>
                        <div className="text-center font-mono font-black text-6xl mb-1 text-blue-300">
                            {reading.toFixed(1)}
                        </div>
                        <div className="text-center text-slate-400 text-sm mb-4">นิ้วปรอท (inHg)</div>
                        <div className="relative h-5 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                            <div className="absolute inset-y-0 left-0 bg-gradient-to-r from-blue-600 to-blue-400" style={{ width: `${pct}%` }}></div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3 mb-3">
                        <button onClick={() => setPumpOn(v => !v)} className={`py-3 rounded-xl font-bold border transition ${pumpOn ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-slate-700 border-slate-500 text-slate-300 hover:bg-slate-600'}`}>
                            <i className="fa-solid fa-plug mr-2"></i> ปั๊มแวคคั่ม: {pumpOn ? 'เปิด' : 'ปิด'}
                        </button>
                        <button onClick={() => setValveOpen(v => !v)} className={`py-3 rounded-xl font-bold border transition ${valveOpen ? 'bg-blue-600 border-blue-400 text-white' : 'bg-slate-700 border-slate-500 text-slate-300 hover:bg-slate-600'}`}>
                            <i className="fa-solid fa-faucet mr-2"></i> วาล์วเกจ: {valveOpen ? 'เปิด' : 'ปิด'}
                        </button>
                    </div>
                    {pumpOn && valveOpen && reading > -0.4 && <p className="text-slate-500 text-xs text-center mb-2">เข็มกำลังเริ่มเดิน...</p>}

                    <button onClick={doStop} className="w-full py-6 rounded-xl text-2xl font-black bg-red-600 hover:bg-red-500 text-white shadow-[0_5px_0_#7f1d1d] active:translate-y-1 active:shadow-[0_0_0_#7f1d1d] transition-all border border-red-400">
                        <i className="fa-solid fa-hand mr-2"></i> หยุด
                    </button>

                    {mode === 'practice' && <p className="text-yellow-400 text-xs mt-3 text-center"><i className="fa-solid fa-lightbulb"></i> ห้ามปล่อยเลยค่าเป้าหมาย · จับจังหวะกดหยุดตอนตัวเลขใกล้ {target.toFixed(1)} นิ้วปรอท มากที่สุด</p>}
                    <button onClick={() => setPhase('hookup')} className="w-full py-2 mt-2 text-xs text-slate-500 hover:text-slate-300">← กลับไปแก้การต่อสาย</button>
                </div>
            );
        };

        /* ============================================================
           MINI-GAME 6 — เลือกถังน้ำยา + ต่อสายเกจ + เติมน้ำยา (Superheat 5–8, ไม่เกิน 5 ปอนด์)
        ============================================================ */
        const CHG_TANKS = [
            { id: 'R22',   name: 'R-22',   color: '#22c55e', th: 'ถังสีเขียว' },
            { id: 'R32',   name: 'R-32',   color: '#ec4899', th: 'ถังสีชมพู' },
            { id: 'R134A', name: 'R-134a', color: '#38bdf8', th: 'ถังสีฟ้า' },
            { id: 'R600A', name: 'R-600a', color: '#f97316', th: 'ถังสีส้ม' }
        ];

        const GameCharging = ({ mode, onFinish, chgKey }) => {
            const K = chgKey || {};
            const correctTankId = K.tank || 'R134A';
            const correctTank = CHG_TANKS.find(t => t.id === correctTankId) || CHG_TANKS[2];
            const chgMin = typeof K.chgMin === 'number' ? K.chgMin : 0;
            const chgMax = typeof K.chgMax === 'number' ? K.chgMax : 10;
            const shMin  = typeof K.shMin === 'number' ? K.shMin : 3;
            const shMax  = typeof K.shMax === 'number' ? K.shMax : 8;
            const akCustom = correctTankId !== 'R134A' || chgMin !== 0 || chgMax !== 10 || shMin !== 3 || shMax !== 8;
            const [phase, setPhase] = useState('pick');       // pick | hookup | charge
            const [pickErr, setPickErr] = useState(false);
            const [pickMsg, setPickMsg] = useState('');
            const [conns, setConns] = useState([]);
            const [sel, setSel] = useState(null);
            const [hookMsg, setHookMsg] = useState('');
            const [hookErr, setHookErr] = useState(false);
            const [chargeLb, setChargeLb] = useState(3);
            const [pressure, setPressure] = useState(0);
            const [satTemp, setSatTemp] = useState(-0.5);
            const [suctionTemp, setSuctionTemp] = useState(13.5);
            const [valveOpen, setValveOpen] = useState(false);
            const [stabilizing, setStabilizing] = useState(0);
            const [result, setResult] = useState(null);

            const pickTank = (id) => {
                if (id === correctTankId) { setPickMsg(''); setPickErr(false); setPhase('hookup'); }
                else { setPickErr(true); setPickMsg(`❌ ผิดชนิด — งานสอบนี้ระบบใช้ ${correctTank.name} (${correctTank.th}) เลือกใหม่`); }
            };

            const NODES = {
                MAN_L: { label: 'พอร์ตเกจ Low', x: 27, y: 22, dot: '#3b82f6' },
                MAN_C: { label: 'พอร์ตเกจ กลาง', x: 45, y: 22, dot: '#eab308' },
                MAN_H: { label: 'พอร์ตเกจ High', x: 63, y: 22, dot: '#ef4444' },
                SYS_L: { label: 'เซอร์วิสวาล์ว Low (ด้านดูด)', x: 16, y: 84 },
                CYL:   { label: 'ถังน้ำยา ' + correctTank.name, x: 45, y: 64 },
                SYS_H: { label: 'เซอร์วิสวาล์ว High (ด้านอัด)', x: 84, y: 84 }
            };
            const CORRECT = [['MAN_L', 'SYS_L'], ['MAN_C', 'CYL'], ['MAN_H', 'SYS_H']];
            const has = (a, b) => conns.some(c => (c[0] === a && c[1] === b) || (c[1] === a && c[0] === b));
            const hoseColor = (a, b) => {
                const m = a.startsWith('MAN') ? a : (b.startsWith('MAN') ? b : null);
                return NODES[m]?.dot || '#94a3b8';
            };
            const clickNode = (id) => {
                if (!sel) { setSel(id); return; }
                if (sel === id) { setSel(null); return; }
                const onePort = (sel.startsWith('MAN')) !== (id.startsWith('MAN'));
                if (onePort) {
                    const idx = conns.findIndex(c => (c[0] === sel && c[1] === id) || (c[1] === sel && c[0] === id));
                    if (idx >= 0) setConns(conns.filter((_, i) => i !== idx));
                    else setConns([...conns.filter(c => !c.includes(sel) && !c.includes(id)), [sel, id]]);
                }
                setSel(null);
            };
            const confirmHookup = () => {
                const missing = CORRECT.filter(([a, b]) => !has(a, b));
                const wrong = conns.filter(c => !CORRECT.some(([a, b]) => (a === c[0] && b === c[1]) || (a === c[1] && b === c[0])));
                if (!missing.length && !wrong.length) { setPhase('charge'); setHookMsg(''); return; }
                setHookErr(true);
                const m = [];
                if (has('MAN_L', 'SYS_H') || has('MAN_H', 'SYS_L')) m.push('สลับสายฟ้า/แดง — สายฟ้า (Low) ต่อด้านดูด, สายแดง (High) ต่อด้านอัด');
                if (has('MAN_C', 'SYS_L') || has('MAN_C', 'SYS_H')) m.push('สายกลาง (เหลือง) ต้องต่อเข้าถังน้ำยา ไม่ใช่เข้าเซอร์วิสวาล์ว');
                if (has('MAN_L', 'CYL') || has('MAN_H', 'CYL')) m.push('ถังน้ำยาต้องต่อกับพอร์ตกลางของเกจเท่านั้น');
                if (!m.length) m.push(`ต่อสายยังไม่ครบ/ไม่ถูก (ขาด ${missing.length} เส้น)`);
                setHookMsg(m.join(' · '));
            };

            useEffect(() => {
                if (phase !== 'charge' || result) return;
                const cv = Math.max(0, (chargeLb - 3) * 2);   // ค่าน้ำยาสะสม (เข็มนิ่ง) หน่วย PSI (~0–10 ในช่วงใช้งาน)
                let iv;
                if (valveOpen) {
                    // เปิดวาล์วเกจ -> น้ำยาไหลเข้า เข็ม "ตีขึ้น" ~+6 PSI จากค่านิ่ง + สะสมไปเรื่อยๆ
                    iv = setInterval(() => {
                        setChargeLb(p => Math.min(13, p + 0.05));
                        setStabilizing(0);
                        const surge = cv + 6 + Math.random() * 2;
                        setPressure(p => p + (surge - p) * 0.45);
                    }, 120);
                } else {
                    // ปล่อยวาล์ว -> เข็ม "ดีดลง" มาที่ค่าน้ำยาที่เติมจริง แล้วระบบค่อยๆ เข้าสมดุล
                    iv = setInterval(() => {
                        setStabilizing(p => Math.min(100, p + 6));
                        const sat = -8 + chargeLb * 2.5;
                        const suc = Math.max(sat, 15 - chargeLb * 0.5);   // จุดพอดี -> Superheat ~3–8
                        setPressure(p => p + (cv - p) * 0.16);
                        setSatTemp(sat);
                        setSuctionTemp(p => p + (suc - p) * 0.16);
                    }, 120);
                }
                return () => clearInterval(iv);
            }, [phase, valveOpen, chargeLb, result]);

            const superheat = suctionTemp - satTemp;
            const isStable = stabilizing >= 100;
            const chargeVal = Math.max(0, (chargeLb - 3) * 2);   // ค่าน้ำยาสะสม (เข็มนิ่ง) PSI

            const evaluate = () => {
                // คะแนนรวมด่าน 6 = เลือกถัง (20) + ต่อสายเกจ (20) + เติมน้ำยา (60)
                const p1 = pickErr ? 8 : 20;
                const p2 = hookErr ? 10 : 20;
                if (!isStable) {
                    setResult({ score: p1 + p2, msg: `❌ ขั้นเติมน้ำยา = 0 (จบงานขณะระบบยังไม่เสถียร — ต้องปล่อยวาล์วรอเข็มนิ่งก่อน) · คะแนนรวมด่าน 6 = ${p1 + p2}` });
                    return;
                }
                const chargeOK = chargeVal >= chgMin && chargeVal <= chgMax;
                const shOK = superheat >= shMin && superheat <= shMax;
                const p3 = (chargeOK && shOK) ? 60 : 0;
                const total = p1 + p2 + p3;
                if (p3 === 0) {
                    const bad = [];
                    if (!chargeOK) bad.push(`น้ำยาสะสม ${chargeVal.toFixed(1)} PSI เกินช่วง ${chgMin}–${chgMax}`);
                    if (!shOK) bad.push(`Superheat ${superheat.toFixed(1)}°C ไม่อยู่ในช่วง ${shMin}–${shMax}`);
                    setResult({ score: total, msg: `❌ ขั้นเติมน้ำยาไม่ผ่าน (${bad.join(' · ')}) = 0 หักล้างกับขั้นเลือกถัง/ต่อสาย · คะแนนรวมด่าน 6 = ${total}` });
                } else {
                    const cut = [pickErr && 'เลือกถังผิด −12', hookErr && 'ต่อสายผิด −10'].filter(Boolean);
                    setResult({ score: total, msg: `✅ เติมน้ำยาสมบูรณ์! น้ำยาสะสม ${chargeVal.toFixed(1)} PSI · Superheat ${superheat.toFixed(1)}°C` + (cut.length ? ` · ${cut.join(', ')}` : '') });
                }
            };

            const reset = () => {
                setResult(null); setPhase('pick'); setPickErr(false); setPickMsg(''); setHookErr(false);
                setConns([]); setSel(null); setHookMsg('');
                setChargeLb(3); setPressure(0); setSatTemp(-0.5); setSuctionTemp(13.5);
                setValveOpen(false); setStabilizing(0);
            };

            if (result) return <MissionEnd score={result.score} maxScore={100} feedback={result.msg}
                onBack={() => onFinish(result.score, result.msg)} retry={reset} />;

            // ---------- PHASE 1 : เลือกถังน้ำยา ----------
            if (phase === 'pick') {
                return (
                    <div className="max-w-3xl mx-auto p-4 sm:p-6">
                        <h2 className="text-2xl font-bold text-cyan-400 mb-1">เติมน้ำยา — ขั้นที่ 1: เลือกถังน้ำยาให้ถูกชนิด</h2>
                        <p className="text-slate-300 text-sm mb-4">เลือกน้ำยาที่ตรงกับระบบเครื่องทำความเย็นในงานสอบนี้</p>
                        {akCustom && <p className="text-xs text-yellow-300 bg-yellow-900/20 border border-yellow-700/40 rounded px-2 py-1 inline-block mb-3"><i className="fa-solid fa-user-pen mr-1"></i> เฉลยด่านนี้ถูกปรับแต่งโดยผู้สอน</p>}
                        {pickMsg && <div className="bg-red-900/30 border border-red-500/50 rounded-lg px-3 py-2 text-sm text-red-300 mb-3"><i className="fa-solid fa-triangle-exclamation mr-2"></i>{pickMsg}</div>}
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            {CHG_TANKS.map(t => (
                                <button key={t.id} onClick={() => pickTank(t.id)}
                                    className="flex flex-col items-center p-4 rounded-2xl border-2 border-slate-700 bg-slate-900 hover:border-slate-400 transition group">
                                    <div className="w-16 h-24 rounded-lg rounded-t-full border-2 shadow-inner mb-3 relative"
                                        style={{ background: t.color, borderColor: 'rgba(0,0,0,0.25)' }}>
                                        <div className="absolute -top-2 left-1/2 -translate-x-1/2 w-4 h-3 bg-slate-600 rounded-sm"></div>
                                    </div>
                                    <div className="font-bold text-white">{t.name}</div>
                                    <div className="text-xs text-slate-400">{t.th}</div>
                                </button>
                            ))}
                        </div>
                        {mode === 'practice' && <p className="text-yellow-400 text-xs mt-4"><i className="fa-solid fa-lightbulb"></i> งานสอบนี้ระบบใช้ {correctTank.name} ({correctTank.th}) — R-22 เขียว, R-32 ชมพู, R-134a ฟ้า, R-600a ส้ม</p>}
                    </div>
                );
            }

            // ---------- PHASE 2 : ต่อสายเกจ (สายกลางเข้าถังน้ำยา) ----------
            if (phase === 'hookup') {
                return (
                    <div className="max-w-4xl mx-auto p-4 sm:p-6">
                        <h2 className="text-2xl font-bold text-cyan-400 mb-1">เติมน้ำยา — ขั้นที่ 2: ต่อสายเกจ</h2>
                        <p className="text-slate-300 text-sm mb-2">ต่อชุดเกจแมนิโฟลด์เข้ากับ <span className="text-cyan-300">ถังน้ำยา</span> และเครื่องทำความเย็นให้ครบ 3 เส้น — คลิกจุดต่อ 2 จุดเพื่อโยงสาย</p>
                        <div className="flex flex-wrap gap-x-4 gap-y-1 mb-2 text-xs text-slate-400">
                            <span>ต่อแล้ว {conns.length}/3 เส้น</span>
                            <span className="text-slate-500">พอร์ตเกจมาตรฐาน:</span>
                            <span><span className="inline-block w-3 h-3 rounded-full bg-blue-500 align-middle mr-1"></span> Low</span>
                            <span><span className="inline-block w-3 h-3 rounded-full bg-yellow-500 align-middle mr-1"></span> กลาง (Service)</span>
                            <span><span className="inline-block w-3 h-3 rounded-full bg-red-500 align-middle mr-1"></span> High</span>
                        </div>
                        {hookMsg && <div className="bg-red-900/30 border border-red-500/50 rounded-lg px-3 py-2 text-sm text-red-300 mb-2"><i className="fa-solid fa-triangle-exclamation mr-2"></i>{hookMsg}</div>}

                        <div className="hscroll -mx-2 sm:mx-0">
                        <div className="relative w-full min-w-[440px] h-[400px] sm:h-[520px] bg-slate-900 rounded-xl border border-slate-600 p-3 sm:p-4 shadow-inner overflow-hidden select-none">
                            <svg className="absolute inset-0 w-full h-full z-10 pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
                                {conns.map((c, i) => {
                                    const a = NODES[c[0]], b = NODES[c[1]];
                                    const my = (a.y + b.y) / 2;
                                    return <path key={i} d={`M ${a.x} ${a.y} C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y}`} fill="none" stroke={hoseColor(c[0], c[1])} strokeWidth="4" strokeLinecap="round" vectorEffect="non-scaling-stroke" opacity="0.95" />;
                                })}
                            </svg>
                            <div className="absolute left-[18%] top-[6%] w-[54%] h-[26%] border-2 border-slate-600 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-300">ชุดเกจแมนิโฟลด์</div>
                            <div className="absolute left-[35%] top-[50%] w-[20%] h-[24%] border-2 border-slate-600 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-300">ถังน้ำยา {correctTank.name}</div>
                            <div className="absolute left-[3%] top-[76%] w-[94%] h-[22%] border-2 border-slate-600 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-300">เครื่องทำความเย็น</div>

                            {Object.entries(NODES).map(([id, n]) => (
                                <div key={id} onClick={() => clickNode(id)}
                                    className="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center cursor-pointer z-20"
                                    style={{ left: `${n.x}%`, top: `${n.y}%` }}>
                                    <div className="w-8 h-8 rounded-full border-4 flex items-center justify-center shadow-lg transition-all"
                                        style={{ borderColor: sel === id ? '#ffffff' : (n.dot || '#64748b'), background: sel === id ? '#facc15' : '#334155', transform: sel === id ? 'scale(1.2)' : 'scale(1)' }}>
                                        <div className="w-1.5 h-1.5 rounded-full bg-slate-900"></div>
                                    </div>
                                    <span className="absolute top-9 px-1.5 py-0.5 rounded text-[10px] font-bold whitespace-nowrap border bg-slate-800 text-slate-300 border-slate-600">{n.label}</span>
                                </div>
                            ))}
                        </div>
                        </div>

                        {mode === 'practice' && <p className="text-yellow-400 text-xs mt-3"><i className="fa-solid fa-lightbulb"></i> สายฟ้า = พอร์ตเกจ Low → เซอร์วิสวาล์วด้านดูด · สายกลาง (เหลือง) = พอร์ตเกจกลาง → ถังน้ำยา · สายแดง = พอร์ตเกจ High → เซอร์วิสวาล์วด้านอัด</p>}
                        <button onClick={confirmHookup} className="w-full py-4 mt-4 bg-cyan-600 hover:bg-cyan-500 text-xl font-bold rounded-xl shadow-lg transition-colors">
                            <i className="fa-solid fa-plug-circle-check mr-2"></i> ยืนยันการต่อสาย → เริ่มเติมน้ำยา
                        </button>
                    </div>
                );
            }

            // ---------- PHASE 3 : เติมน้ำยา ----------
            const needleRotation = -120 + (Math.min(Math.max(pressure, 0), 20) / 20 * 240);   // สเกลเกจ 0–20 PSI
            const chgPct = Math.min(100, Math.max(0, chargeVal / 12 * 100));
            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6">
                    <div className="mb-4">
                        <h2 className="text-2xl font-bold text-cyan-400">เติมน้ำยา — ขั้นที่ 3: ชาร์จ {correctTank.name}</h2>
                        <p className="text-slate-400 text-sm">กดค้าง = เปิดเกจ เข็มตีขึ้น น้ำยาไหลเข้าสะสม · ปล่อย = เข็มดีดลงมาที่ค่าน้ำยาที่เติมจริง · ทำเป็นช่วงๆ ให้เข็มนิ่งอยู่ {chgMin}–{chgMax} PSI และ Superheat {shMin}–{shMax}°C</p>
                    </div>

                    {/* ภาพรวมระบบ: ค่าฝั่งท่อดูด (ซ้าย) · เกจ Low + น้ำยาสะสม (กลาง) · Superheat (ขวา) */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 items-stretch mb-4">
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col justify-center shadow-lg">
                            <div className="text-xs font-bold text-blue-300 mb-2">ค่าฝั่งท่อดูด (Low Side)</div>
                            <div className="mb-2">
                                <div className="text-[11px] font-bold text-orange-400">อุณหภูมิท่อดูด</div>
                                <div className="text-2xl font-mono font-bold text-white">{suctionTemp.toFixed(1)} <span className="text-sm">°C</span></div>
                            </div>
                            <div>
                                <div className="text-[11px] font-bold text-purple-400">อุณหภูมิอิ่มตัว</div>
                                <div className="text-2xl font-mono font-bold text-white">{satTemp.toFixed(1)} <span className="text-sm">°C</span></div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col items-center justify-center shadow-lg">
                            <div className="text-xs font-bold text-blue-400 mb-2">LOW SIDE PRESSURE</div>
                            <div className="relative w-36 h-36 rounded-full border-[10px] border-blue-500 bg-slate-900 flex items-center justify-center shadow-inner">
                                <div className="absolute w-1 h-14 bg-red-500 rounded-t-full origin-bottom bottom-1/2 gauge-needle" style={{ transform: `rotate(${needleRotation}deg)` }}></div>
                                <div className="w-4 h-4 rounded-full bg-slate-300 z-10"></div>
                                <div className="absolute bottom-5 text-2xl font-mono font-black text-white">{pressure.toFixed(1)}</div>
                                <div className="absolute bottom-2 text-[10px] text-slate-500">PSI</div>
                            </div>
                            <div className="mt-3 w-full">
                                <div className="text-[10px] text-slate-500 uppercase tracking-wide text-center mb-1">น้ำยาสะสม (PSI)</div>
                                <div className="relative h-3 w-full bg-slate-900 rounded-full overflow-hidden border border-slate-700">
                                    <div className="absolute inset-y-0 left-0 bg-cyan-500 transition-all duration-150" style={{ width: `${Math.min(100, chargeVal / 20 * 100)}%` }}></div>
                                    {[5, 10, 15].map(t => (
                                        <div key={t} className="absolute inset-y-0 w-px bg-slate-600" style={{ left: `${t / 20 * 100}%` }}></div>
                                    ))}
                                </div>
                                <div className="relative w-full h-3 mt-0.5">
                                    {[0, 5, 10, 15, 20].map(t => (
                                        <span key={t} className={`absolute text-[9px] text-slate-500 font-mono ${t === 0 ? 'left-0' : t === 20 ? 'right-0' : '-translate-x-1/2'}`} style={t === 0 || t === 20 ? undefined : { left: `${t / 20 * 100}%` }}>{t}</span>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col items-center justify-center shadow-lg relative">
                            {!isStable && (
                                <div className="absolute inset-0 bg-slate-900/80 rounded-xl z-20 flex flex-col items-center justify-center backdrop-blur-sm">
                                    <i className="fa-solid fa-spinner fa-spin text-2xl text-yellow-400 mb-1"></i>
                                    <div className="text-yellow-400 font-bold text-xs">กำลังปรับสมดุลระบบ</div>
                                    <div className="w-20 h-1 bg-slate-700 mt-2 rounded overflow-hidden"><div className="h-full bg-yellow-400" style={{ width: `${stabilizing}%` }}></div></div>
                                </div>
                            )}
                            <div className="text-xs font-bold text-slate-300 mb-1">SUPERHEAT</div>
                            <div className={`text-5xl font-mono font-black ${isStable ? 'text-white' : 'text-slate-500'}`}>{isStable ? superheat.toFixed(1) : '-.-'}</div>
                            <div className="text-base text-slate-300 font-mono">°C</div>
                        </div>
                    </div>

                    {/* ปุ่มเติม — แถบในปุ่มไล่ตามค่าน้ำยาสะสม (PSI) */}
                    <div className="mb-4">
                        <button onMouseDown={() => setValveOpen(true)} onMouseUp={() => setValveOpen(false)} onMouseLeave={() => setValveOpen(false)} onTouchStart={() => setValveOpen(true)} onTouchEnd={() => setValveOpen(false)}
                            className={`relative w-full py-6 rounded-xl font-bold text-xl shadow-lg transition-all border select-none overflow-hidden
                            ${valveOpen ? 'border-cyan-300 scale-[0.99]' : 'border-slate-500 hover:border-cyan-400'}`}>
                            <div className="absolute inset-0 bg-slate-700"></div>
                            <div className="absolute inset-y-0 left-0 bg-cyan-600/70 transition-all duration-150" style={{ width: `${chgPct}%` }}></div>
                            <span className="relative z-10 flex items-center justify-center text-white">
                                <i className={`fa-solid ${valveOpen ? 'fa-gas-pump fa-shake' : 'fa-hand-pointer'} mr-3`}></i>
                                {valveOpen ? `กำลังอัดน้ำยา... เข็มนิ่ง ${chargeVal.toFixed(1)} PSI` : `กดค้างเพื่อเติมน้ำยา (ปิด-เปิดเป็นช่วง) · เข็มนิ่ง ${chargeVal.toFixed(1)} PSI`}
                            </span>
                        </button>
                    </div>

                    {mode === 'practice' && <p className="text-yellow-400 text-xs mb-4 text-center"><i className="fa-solid fa-lightbulb"></i> เปิด-ปิดเป็นช่วง เข็มตีขึ้นแล้วปล่อยให้ลดลง · ปล่อยวาล์วรอ “ปรับสมดุลระบบ” ครบ 100% แล้วบันทึก · เกณฑ์ผ่าน: น้ำยาสะสม {chgMin}–{chgMax} PSI <b>และ</b> Superheat {shMin}–{shMax}°C (ถ้าหลุดเกณฑ์ ขั้นเติมน้ำยา = 0 หักล้างกับขั้นก่อนหน้า)</p>}

                    <button onClick={evaluate} className="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-lg font-bold rounded-xl shadow-lg border border-emerald-400 text-white transition-all">
                        <i className="fa-solid fa-clipboard-check mr-2"></i> ปิดวาล์วเกจ · บันทึกค่าและจบงาน
                    </button>
                </div>
            );
        };

        /* ============================================================
           MISSION FRAME — หัวด่าน + จับเวลาโหมดสอบ
        ============================================================ */
        const GAME_COMPONENTS = { prep: GamePrep, braze: GameBrazing, wire: GameWiring, pipe: GamePiping, vacuum: GameVacuum, charge: GameCharging };

        const MissionFrame = ({ mission, mode, answerKey, wireKey, extraKey, totalTimerOn, totalLeft, onDone, onExit }) => {
            const Cmp = GAME_COMPONENTS[mission.id];
            const localTimer = mode === 'exam' && !totalTimerOn;   // จับเวลารายด่าน (เมื่อไม่ได้ตั้งเวลารวม)
            const examTime = mission.time || 150;
            const [left, setLeft] = useState(localTimer ? examTime : null);
            const doneRef = useRef(false);

            useEffect(() => {
                if (!localTimer || left === null) return;
                if (left <= 0) {
                    if (!doneRef.current) { doneRef.current = true; onDone(mission.id, 0, '⏱ หมดเวลาสอบ — ปฏิบัติงานไม่เสร็จ'); }
                    return;
                }
                const t = setTimeout(() => setLeft(l => l - 1), 1000);
                return () => clearTimeout(t);
            }, [left, localTimer]);

            const finish = (s, f) => { if (doneRef.current) return; doneRef.current = true; onDone(mission.id, s, f); };

            return (
                <div className="pb-16 animate-fade-in">
                    <div className="max-w-5xl mx-auto px-4 pt-4 flex items-center justify-between gap-3 flex-wrap">
                        <button onClick={onExit} className="px-4 py-2 rounded-lg bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700 text-sm">
                            <i className="fa-solid fa-arrow-left mr-2"></i>{mode === 'exam' ? 'ออกจากการสอบ' : 'กลับสู่ภารกิจ'}
                        </button>
                        <div className="flex items-center gap-2">
                            <span className={`text-xs px-3 py-1 rounded-full border ${mode === 'exam' ? 'border-red-500 text-red-400' : 'border-blue-500 text-blue-400'}`}>
                                {mode === 'exam' ? 'โหมดสอบจับเวลา' : 'โหมดฝึกซ้อม'}
                            </span>
                            {mode === 'exam' && (totalTimerOn
                                ? <span className="flex items-center gap-1"><span className="text-[10px] text-slate-400">เวลารวม</span><TimerPill left={Math.max(0, totalLeft || 0)} /></span>
                                : <TimerPill left={left} />)}
                        </div>
                    </div>
                    <Cmp mode={mode} answerKey={answerKey} wireKey={wireKey}
                        brazeKey={extraKey.braze} flameKey={extraKey.brazeFlame} pipeKey={extraKey.pipe} vacKey={extraKey.vacuum} chgKey={extraKey.charge}
                        onFinish={finish} />
                </div>
            );
        };

        /* ============================================================
           LEVEL MAP — แผนที่เดินทางทีละด่าน
        ============================================================ */
        const LevelMap = ({ scores, unlockedIndex, isTeacher, akCustomized, previewAll, examLeft, examTimedOut, onTogglePreview, onSelect, onReset, onTeacher, onShowComplete }) => {
            const passedCount = MISSIONS.filter(m => (scores[m.id]?.score ?? 0) >= PASS).length;
            const doneCount = MISSIONS.filter(m => scores[m.id]).length;
            const pct = Math.round(passedCount / MISSIONS.length * 100);
            const allPass = passedCount === MISSIONS.length;
            const allDone = doneCount === MISSIONS.length;
            const exam = examScore(scores);

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 animate-fade-in">
                    <div className="text-center mb-8">
                        <h2 className="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-200 via-sky-300 to-cyan-300 mb-2 leading-[1.4] py-1 drop-shadow-[0_0_18px_rgba(56,189,248,0.25)]">แผนที่ภารกิจช่างเครื่องทำความเย็น</h2>
                        <p className="text-sky-200/70">ปฏิบัติให้ผ่านทีละด่าน — ปลดล็อกด่านถัดไปเมื่อได้ {PASS}% ขึ้นไป</p>
                    </div>

                    <div className="glass-panel rounded-2xl p-5 mb-10 flex items-center gap-4 flex-wrap">
                        <div className="shrink-0">
                            <div className="text-xs text-sky-300/70 uppercase tracking-wide">ความคืบหน้า</div>
                            <div className="text-2xl font-black text-cyan-300">{passedCount}/{MISSIONS.length} ด่าน</div>
                        </div>
                        <div className="flex-1 min-w-[160px] h-4 bg-[#08213f] rounded-full overflow-hidden border border-sky-400/20">
                            <div className="h-full bg-gradient-to-r from-sky-400 to-cyan-300 transition-all duration-700 glow-blue" style={{ width: pct + '%' }}></div>
                        </div>
                        <div className="text-xl font-bold text-sky-100 w-14 text-right">{pct}%</div>
                    </div>

                    {examLeft !== null && !examTimedOut && (
                        <div className="bg-red-900/20 border border-red-500/40 rounded-2xl p-4 mb-6 flex items-center justify-between gap-3 flex-wrap animate-fade-in">
                            <span className="text-red-200 text-sm"><i className="fa-solid fa-stopwatch mr-2"></i> โหมดสอบจับเวลารวมทั้ง 6 ด่าน — นาฬิกาเดินต่อเนื่องระหว่างสลับด่าน</span>
                            <TimerPill left={examLeft} />
                        </div>
                    )}

                    {examTimedOut && (
                        <div className="bg-red-900/40 border border-red-500/60 rounded-2xl p-5 mb-6 text-center animate-fade-in">
                            <i className="fa-solid fa-hourglass-end text-red-400 text-3xl mb-2"></i>
                            <p className="text-red-200 font-bold mb-1">⏱ หมดเวลาสอบรวมแล้ว</p>
                            <p className="text-slate-300 text-sm mb-3">ผลสอบถูกบันทึกแล้ว · ด่านที่ยังไม่ได้ทำนับเป็น 0 · เริ่มสอบใหม่ได้ที่ปุ่ม “ล้างความคืบหน้าทั้งหมด”</p>
                            <button onClick={onShowComplete} className="px-6 py-2 rounded-xl bg-slate-200 text-slate-900 font-bold"><i className="fa-solid fa-award mr-2"></i> ดูสรุปผลการสอบ</button>
                        </div>
                    )}

                    {previewAll && (
                        <div className="bg-blue-900/30 border border-blue-500/50 rounded-2xl p-4 mb-6 flex items-center justify-between gap-3 flex-wrap animate-fade-in">
                            <span className="text-blue-200 text-sm"><i className="fa-solid fa-eye mr-2"></i> โหมดพรีวิว — ปลดล็อกทุกด่านชั่วคราว (ความคืบหน้า/ดาวจริงยังนับตามปกติ)</span>
                            <button onClick={onTogglePreview} className="text-xs px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700 shrink-0">ปิดพรีวิว</button>
                        </div>
                    )}

                    {allDone && (
                        <div className="frost-card rounded-2xl p-5 mb-8 text-center animate-fade-in">
                            <i className="fa-solid fa-trophy text-cyan-300 text-3xl mb-2 drop-shadow-[0_0_12px_rgba(56,189,248,0.5)]"></i>
                            <p className="text-sky-100 font-bold mb-1">ทำครบทั้ง 6 ด่านแล้ว!</p>
                            <p className="text-sky-200/80 text-sm mb-3">คะแนนสอบ <span className="font-black text-cyan-300 text-lg">{exam.toFixed(1)}</span> / {EXAM_MAX}{!allPass && <span className="text-red-300"> · ยังมีด่านที่ไม่ผ่าน</span>}</p>
                            <button onClick={onShowComplete} className="px-6 py-2 rounded-xl bg-gradient-to-r from-sky-400 to-cyan-300 text-[#062033] font-bold glow-blue">
                                <i className="fa-solid fa-award mr-2"></i> ดูสรุปผลการสอบ
                            </button>
                        </div>
                    )}

                    <div className="relative">
                        <div className="absolute left-1/2 -translate-x-1/2 top-4 bottom-4 w-1 bg-gradient-to-b from-sky-500/30 via-sky-400/40 to-sky-500/30 rounded"></div>
                        <div className="space-y-6 relative">
                            {MISSIONS.map((m, i) => {
                                const rec = scores[m.id];
                                const done = !!rec;
                                const passed = (rec?.score ?? 0) >= PASS;
                                const locked = i > unlockedIndex;
                                const current = i === unlockedIndex && !passed;
                                const left = i % 2 === 0;
                                return (
                                    <div key={m.id} className={`relative flex ${left ? 'md:flex-row' : 'md:flex-row-reverse'} flex-col items-center gap-4`}>
                                        <div className="md:w-1/2 flex md:justify-center">
                                            <button onClick={() => !locked && !examTimedOut && onSelect(m.id)} disabled={locked || examTimedOut}
                                                className={`relative w-24 h-24 rounded-full flex flex-col items-center justify-center border-4 shadow-xl transition-all
                                                ${(locked || examTimedOut) ? 'bg-[#0a1f3c] border-[#123055] text-slate-600 cursor-not-allowed'
                                                    : passed ? 'bg-gradient-to-br from-cyan-400 to-blue-600 border-cyan-200 text-white hover:scale-105 glow-blue'
                                                    : current ? 'bg-gradient-to-br from-sky-400 to-blue-600 border-sky-200 text-white hover:scale-105 pulse-ring'
                                                    : 'bg-[#0e2850] border-sky-400/30 text-sky-200 hover:scale-105'}`}>
                                                {locked ? <i className="fa-solid fa-lock text-2xl"></i>
                                                    : passed ? <i className="fa-solid fa-check text-3xl"></i>
                                                    : <i className={`fa-solid ${m.icon} text-2xl`}></i>}
                                                <span className="absolute -top-2 -left-2 w-8 h-8 rounded-full bg-[#04122a] border-2 border-sky-400/40 text-sky-100 text-sm font-bold flex items-center justify-center">{i + 1}</span>
                                            </button>
                                        </div>
                                        <div className={`md:w-1/2 w-full ${left ? 'md:text-left' : 'md:text-right'} text-center`}>
                                            <div className={`inline-block rounded-xl px-5 py-3 border max-w-sm ${locked ? 'bg-[#0a1f3c]/50 border-[#123055]' : 'frost-card'}`}>
                                                <div className={`font-bold ${locked ? 'text-slate-500' : 'text-white'}`}>{m.title}</div>
                                                <div className={`text-sm ${locked ? 'text-slate-600' : 'text-sky-200/70'}`}>{m.desc}</div>
                                                <div className={`mt-2 flex gap-2 items-center ${left ? 'md:justify-start' : 'md:justify-end'} justify-center`}>
                                                    {locked ? <span className="text-xs text-slate-600">🔒 ต้องผ่านด่านที่ {i} ก่อน</span>
                                                        : done ? <><Stars n={rec.stars} size="text-sm" /><span className={`font-bold ${passed ? 'text-cyan-300' : 'text-red-400'}`}>{rec.score}</span>{rec.attempts > 1 && <span className="text-xs text-slate-500">· ลอง {rec.attempts} ครั้ง</span>}</>
                                                        : <span className="text-xs text-sky-300 font-semibold">▶ พร้อมปฏิบัติงาน</span>}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="mt-8 text-center">
                        <button onClick={onShowComplete} className="px-6 py-3 rounded-xl bg-gradient-to-r from-sky-400 to-cyan-300 text-[#062033] font-bold shadow-lg glow-blue hover:from-sky-300 hover:to-cyan-200 transition-colors">
                            <i className="fa-solid fa-award mr-2"></i> ดูคะแนนรวม / สรุปผลการสอบ
                            <span className="ml-2 font-mono">({exam.toFixed(1)} / {EXAM_MAX})</span>
                        </button>
                        <div className="text-xs text-sky-200/50 mt-1">
                            {doneCount === 0 ? 'ยังไม่ได้ทำด่านใด — เริ่มทำข้อสอบได้เลย'
                                : allDone ? `ทำครบทั้ง ${MISSIONS.length} ด่านแล้ว`
                                : `ทำแล้ว ${doneCount}/${MISSIONS.length} ด่าน · ด่านที่ยังไม่ได้ทำนับเป็น 0`}
                        </div>
                    </div>

                    {isTeacher && (
                        <div className="mt-10 flex flex-col sm:flex-row justify-center gap-3">
                            <button onClick={onReset} className="px-6 py-3 rounded-xl bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700 text-sm">
                                <i className="fa-solid fa-rotate-left mr-2"></i> ล้างความคืบหน้าทั้งหมด
                            </button>
                            <button onClick={onTogglePreview} className="px-6 py-3 rounded-xl bg-slate-800 border border-slate-600 text-slate-400 hover:text-blue-300 text-sm">
                                <i className={`fa-solid ${previewAll ? 'fa-eye-slash' : 'fa-eye'} mr-2`}></i> {previewAll ? 'ปิดพรีวิวทุกด่าน' : 'พรีวิวทุกด่าน (สำหรับผู้สอน)'}
                            </button>
                            <button onClick={onTeacher} className="px-6 py-3 rounded-xl bg-slate-800 border border-slate-600 text-slate-400 hover:text-blue-300 text-sm">
                                <i className="fa-solid fa-user-gear mr-2"></i> โหมดผู้สอน — แก้เฉลยทั้ง 6 ด่าน
                                {akCustomized && <span className="ml-2 text-[10px] px-1.5 py-0.5 rounded bg-yellow-600 text-white align-middle">ปรับแต่งแล้ว</span>}
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        /* ============================================================
           COMPLETE SCREEN — ใบรับรองผล
        ============================================================ */
        const CompleteScreen = ({ scores, student, timedOut, canSubmit, submitStatus, onSubmit, onBack }) => {
            useEffect(() => { if (canSubmit && submitStatus === 'idle') onSubmit(); }, []);
            const totalStars = MISSIONS.reduce((s, m) => s + (scores[m.id]?.stars || 0), 0);
            const avg = Math.round(MISSIONS.reduce((s, m) => s + (scores[m.id]?.score || 0), 0) / MISSIONS.length);
            const exam = examScore(scores);                       // 0–10
            const passedAll = MISSIONS.every(m => (scores[m.id]?.score ?? 0) >= PASS);
            return (
                <div className="max-w-2xl mx-auto p-4 sm:p-6 animate-fade-in">
                    <div className="frost-card rounded-3xl p-8 md:p-10 text-center">
                        <i className={`fa-solid ${passedAll ? 'fa-award text-cyan-300' : 'fa-clipboard-check text-sky-300'} text-7xl mb-4 drop-shadow-[0_0_22px_rgba(56,189,248,0.55)]`}></i>
                        <h2 className="text-3xl font-black text-white mb-1">สรุปผลการสอบปฏิบัติ</h2>
                        <p className="text-sky-200/70 mb-2">ทักษะปฏิบัติงานช่างเครื่องทำความเย็น · HVAC Practical Assessment</p>
                        {student && <p className="text-sky-100 text-sm mb-4">ผู้เข้าสอบ: <span className="font-bold text-white">{student.first} {student.last}</span></p>}
                        {timedOut && <p className="text-red-300 text-sm mb-4 bg-red-900/30 border border-red-500/40 rounded-lg px-3 py-2"><i className="fa-solid fa-hourglass-end mr-2"></i> หมดเวลาสอบรวม — ด่านที่ยังไม่ได้ทำนับเป็น 0</p>}

                        <div className="bg-[#08213f] rounded-2xl p-6 border-2 border-sky-400/35 mb-6 glow-blue">
                            <div className="text-xs text-sky-300/60 uppercase tracking-widest">คะแนนการสอบ</div>
                            <div className="text-6xl font-black text-cyan-300 leading-tight">{exam.toFixed(1)}<span className="text-2xl text-sky-300/50"> / {EXAM_MAX}</span></div>
                            <div className={`text-sm font-bold mt-1 ${passedAll ? 'text-cyan-300' : 'text-red-400'}`}>{passedAll ? '✅ ผ่านครบทุกด่าน' : '✗ ยังมีด่านที่ไม่ผ่านเกณฑ์ 50%'}</div>
                        </div>

                        <div className="grid grid-cols-2 gap-4 mb-8">
                            <div className="bg-[#08213f] rounded-xl p-4 border border-sky-400/20">
                                <div className="text-xs text-sky-300/60 uppercase">คะแนนเฉลี่ย</div>
                                <div className="text-4xl font-black text-sky-200">{avg}<span className="text-lg text-sky-300/50">%</span></div>
                            </div>
                            <div className="bg-[#08213f] rounded-xl p-4 border border-sky-400/20">
                                <div className="text-xs text-sky-300/60 uppercase">ดาวสะสม</div>
                                <div className="text-4xl font-black text-yellow-300">{totalStars}<span className="text-lg text-sky-300/50">/{MISSIONS.length * 3}</span></div>
                            </div>
                        </div>
                        <div className="space-y-2 text-left mb-8">
                            {MISSIONS.map(m => {
                                const rec = scores[m.id] || {};
                                const p = (rec.score ?? 0) >= PASS;
                                return (
                                    <div key={m.id} className="flex items-center justify-between bg-[#0b2547]/70 rounded-lg px-4 py-2 border border-sky-400/15">
                                        <span className="text-sky-100/90 text-sm"><i className={`fa-solid ${m.icon} mr-2 text-sky-300/50`}></i>{m.title}</span>
                                        <span className={`font-bold ${p ? 'text-cyan-300' : 'text-red-400'}`}>{((rec.score || 0) / 10).toFixed(1)}<span className="text-sky-300/40 text-xs"> / 10</span> <span className="text-yellow-300 ml-1">{'★'.repeat(rec.stars || 0)}</span></span>
                                    </div>
                                );
                            })}
                        </div>
                        {canSubmit && (
                            <div className="mb-4">
                                <button onClick={onSubmit} disabled={submitStatus === 'sending' || submitStatus === 'ok'}
                                    className={`w-full py-3 rounded-xl font-bold transition-colors border ${
                                        submitStatus === 'ok' ? 'bg-cyan-500/15 border-cyan-400/50 text-cyan-300'
                                        : submitStatus === 'error' ? 'bg-red-500/15 border-red-400/50 text-red-300 hover:bg-red-500/25'
                                        : submitStatus === 'sending' ? 'bg-[#0e2850] border-sky-400/30 text-sky-200'
                                        : 'bg-gradient-to-r from-blue-500 to-blue-700 border-blue-400 text-white hover:from-blue-400 hover:to-blue-600'}`}>
                                    <i className={`fa-solid ${submitStatus === 'ok' ? 'fa-circle-check' : submitStatus === 'sending' ? 'fa-spinner fa-spin' : submitStatus === 'error' ? 'fa-triangle-exclamation' : 'fa-cloud-arrow-up'} mr-2`}></i>
                                    {submitStatus === 'ok' ? 'ส่งผลสอบเข้าระบบแล้ว'
                                        : submitStatus === 'sending' ? 'กำลังส่งผลสอบ...'
                                        : submitStatus === 'error' ? 'ส่งไม่สำเร็จ — แตะเพื่อลองใหม่'
                                        : 'ส่งผลสอบเข้าระบบ'}
                                </button>
                            </div>
                        )}
                        <button onClick={onBack} className="px-6 py-3 rounded-xl bg-gradient-to-r from-sky-400 to-cyan-300 hover:from-sky-300 hover:to-cyan-200 text-[#062033] font-bold glow-blue transition-colors"><i className="fa-solid fa-map-location-dot mr-2"></i> กลับสู่ภารกิจ</button>
                    </div>
                </div>
            );
        };

        /* ============================================================
           TEACHER GATE — ใส่รหัสก่อนแก้เฉลย
        ============================================================ */
        const TeacherGate = ({ onOk, onCancel, title = 'โหมดผู้สอน', subtitle = 'ใส่รหัสเพื่อเข้าแก้เฉลยและตั้งค่าการสอบ' }) => {
            const [code, setCode] = useState('');
            const [err, setErr] = useState(false);
            const submit = () => { if (code === TEACHER_CODE) onOk(); else { setErr(true); setCode(''); } };
            return (
                <div className="max-w-sm mx-auto p-4 sm:p-6 mt-16 animate-fade-in">
                    <div className="bg-slate-800 border border-slate-600 rounded-2xl p-8 text-center shadow-xl">
                        <i className="fa-solid fa-lock text-4xl text-blue-400 mb-4"></i>
                        <h2 className="text-xl font-bold text-white mb-1">{title}</h2>
                        <p className="text-slate-400 text-sm mb-5">{subtitle}</p>
                        <input type="password" value={code} autoFocus
                            onChange={e => { setCode(e.target.value); setErr(false); }}
                            onKeyDown={e => { if (e.key === 'Enter') submit(); }}
                            className="w-full text-center tracking-[0.3em] text-xl bg-slate-900 border border-slate-600 rounded-lg py-3 mb-3 text-white outline-none focus:border-blue-500" placeholder="••••" />
                        {err && <p className="text-red-400 text-sm mb-3"><i className="fa-solid fa-circle-exclamation mr-1"></i> รหัสไม่ถูกต้อง</p>}
                        <div className="flex gap-3">
                            <button onClick={onCancel} className="flex-1 py-2.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200">ยกเลิก</button>
                            <button onClick={submit} className="flex-1 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 font-bold">เข้าสู่ระบบ</button>
                        </div>
                    </div>
                </div>
            );
        };

        /* ============================================================
           ANSWER-KEY EDITOR — โหมดผู้สอน (ด่าน 1)
        ============================================================ */
        const AnswerKeyEditor = ({ override, onSave, onReset, onBack }) => {
            const [work, setWork] = useState(() => {
                const w = {};
                PREP_ITEMS.forEach(i => { w[i.id] = effectiveCorrect(i, override); });
                return w;
            });
            const toggle = (id) => setWork(p => ({ ...p, [id]: !p[id] }));
            const count = Object.values(work).filter(Boolean).length;
            const changedCount = PREP_ITEMS.filter(i => work[i.id] !== i.correct).length;

            const handleSave = () => {
                const diff = {};
