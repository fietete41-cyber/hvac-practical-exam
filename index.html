                PREP_ITEMS.forEach(i => { if (work[i.id] !== i.correct) diff[i.id] = work[i.id]; });
                onSave(diff);
            };

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6 animate-fade-in">
                    <div className="flex items-start justify-between mb-4 gap-3 flex-wrap">
                        <div>
                            <h2 className="text-2xl font-black text-white"><i className="fa-solid fa-user-gear mr-2 text-blue-400"></i> แก้เฉลย — ด่าน 1 (เบิกอุปกรณ์)</h2>
                            <p className="text-slate-400 text-sm mt-1">กดที่รายการเพื่อสลับว่าเป็น “ของที่ต้องเบิก” หรือไม่ · เฉลยปัจจุบัน <span className="text-emerald-400 font-bold">{count}</span> ชิ้น · แก้จากค่าเริ่มต้น {changedCount} จุด</p>
                        </div>
                        <button onClick={onBack} className="px-4 py-2 rounded-lg bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700 text-sm"><i className="fa-solid fa-arrow-left mr-2"></i>กลับเมนูผู้สอน</button>
                    </div>

                    {PREP_CATS.map(cat => (
                        <div key={cat.key} className="mb-5">
                            <h3 className={`text-sm font-bold uppercase tracking-wide border-l-4 pl-3 mb-2 ${cat.accent}`}>{cat.label}</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                {PREP_ITEMS.filter(i => i.cat === cat.key).map(i => {
                                    const on = work[i.id];
                                    const moved = work[i.id] !== i.correct;
                                    return (
                                        <button key={i.id} onClick={() => toggle(i.id)}
                                            className={`flex items-center justify-between px-3 py-2 rounded-lg border text-left transition
                                            ${on ? 'bg-emerald-900/30 border-emerald-600' : 'bg-slate-900 border-slate-700'}`}>
                                            <span className="flex items-center gap-2 text-sm min-w-0">
                                                <i className={`fa-solid ${i.icon} ${on ? 'text-emerald-400' : 'text-slate-500'} shrink-0`}></i>
                                                <span className={`${on ? 'text-white' : 'text-slate-400'} truncate`}>{i.name}</span>
                                                {moved && <span className="text-[10px] px-1 rounded bg-yellow-600 text-white shrink-0">แก้แล้ว</span>}
                                            </span>
                                            <i className={`fa-solid ${on ? 'fa-toggle-on text-emerald-400' : 'fa-toggle-off text-slate-600'} text-xl shrink-0 ml-2`}></i>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    ))}

                    <div className="flex flex-col sm:flex-row gap-3 mt-6">
                        <button onClick={handleSave} className="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold"><i className="fa-solid fa-floppy-disk mr-2"></i> บันทึกเฉลย</button>
                        <button onClick={onReset} className="px-6 py-3 rounded-xl bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700"><i className="fa-solid fa-rotate-left mr-2"></i> คืนค่าเริ่มต้น</button>
                    </div>
                </div>
            );
        };

        /* ============================================================
           WIRE-KEY EDITOR — โหมดผู้สอน แก้เฉลยการต่อสาย (ด่าน 3)
        ============================================================ */
        const WireKeyEditor = ({ pairs, custom, onSave, onReset, onClose }) => {
            const [list, setList] = useState(() => pairs.map(([a, b]) => [a, b]));
            const [na, setNa] = useState('L');
            const [nb, setNb] = useState('TH1');
            const ids = Object.keys(WIRE_NODES);

            const removeAt = (i) => setList(list.filter((_, idx) => idx !== i));
            const add = () => {
                if (na === nb) return;
                if (list.some(([a, b]) => pairKey(a, b) === pairKey(na, nb))) return;
                setList([...list, [na, nb]]);
            };

            return (
                <div className="max-w-3xl mx-auto p-4 sm:p-6 animate-fade-in">
                    <div className="flex items-start justify-between mb-4 gap-3 flex-wrap">
                        <div>
                            <h2 className="text-2xl font-black text-white"><i className="fa-solid fa-diagram-project mr-2 text-blue-400"></i> แก้เฉลยการต่อสาย — ด่าน 3</h2>
                            <p className="text-slate-400 text-sm mt-1">กำหนดคู่จุดต่อที่ถือว่า “ถูกต้อง” · ตอนนี้ {list.length} เส้น {custom && <span className="text-yellow-400">(ปรับแต่งแล้ว)</span>}</p>
                        </div>
                        <button onClick={onClose} className="px-4 py-2 rounded-lg bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700 text-sm"><i className="fa-solid fa-arrow-left mr-2"></i>กลับ</button>
                    </div>

                    <div className="space-y-2 mb-5">
                        {list.map(([a, b], i) => (
                            <div key={i} className="flex items-center justify-between bg-slate-900 border border-slate-700 rounded-lg px-3 py-2">
                                <span className="text-sm text-slate-200"><span className="text-slate-400">{i + 1}.</span> {WIRE_FULLNAME[a] || a} <i className="fa-solid fa-arrows-left-right mx-2 text-slate-500"></i> {WIRE_FULLNAME[b] || b}</span>
                                <button onClick={() => removeAt(i)} className="text-xs text-slate-400 hover:text-red-400 shrink-0"><i className="fa-solid fa-trash mr-1"></i>ลบ</button>
                            </div>
                        ))}
                        {list.length === 0 && <p className="text-slate-500 text-sm text-center py-4 border border-dashed border-slate-700 rounded-lg">ยังไม่มีคู่สายในเฉลย</p>}
                    </div>

                    <div className="bg-slate-800/60 border border-slate-700 rounded-lg p-3 flex flex-wrap items-center gap-2 mb-6">
                        <span className="text-xs text-slate-400">เพิ่มคู่สาย:</span>
                        <select value={na} onChange={e => setNa(e.target.value)} className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-sm text-white">
                            {ids.map(id => <option key={id} value={id}>{WIRE_FULLNAME[id] || id}</option>)}
                        </select>
                        <i className="fa-solid fa-arrows-left-right text-slate-500"></i>
                        <select value={nb} onChange={e => setNb(e.target.value)} className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-sm text-white">
                            {ids.map(id => <option key={id} value={id}>{WIRE_FULLNAME[id] || id}</option>)}
                        </select>
                        <button onClick={add} className="px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 text-sm font-semibold"><i className="fa-solid fa-plus mr-1"></i>เพิ่ม</button>
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3">
                        <button onClick={() => onSave(list)} className="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold"><i className="fa-solid fa-floppy-disk mr-2"></i> บันทึกเฉลยการต่อสาย</button>
                        <button onClick={onReset} className="px-6 py-3 rounded-xl bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700"><i className="fa-solid fa-rotate-left mr-2"></i> คืนค่าเริ่มต้น</button>
                    </div>
                </div>
            );
        };

        /* ============================================================
           BRAZE-KEY EDITOR — โหมดผู้สอน แก้ลำดับงานเชื่อมท่อ (ด่าน 2)
        ============================================================ */
        const BrazeKeyEditor = ({ order, flame, onSave, onReset, onBack }) => {
            const [list, setList] = useState(() => order.slice());
            const [fl, setFl] = useState(flame || 'neutral');
            const move = (i, d) => {
                const j = i + d;
                if (j < 0 || j >= list.length) return;
                const n = list.slice(); [n[i], n[j]] = [n[j], n[i]]; setList(n);
            };
            const changed = list.join(',') !== BRAZE_DEFAULT_ORDER.join(',') || fl !== 'neutral';
            return (
                <div className="max-w-2xl mx-auto p-4 sm:p-6 animate-fade-in">
                    <div className="flex items-start justify-between mb-4 gap-3 flex-wrap">
                        <div>
                            <h2 className="text-2xl font-black text-white"><i className="fa-solid fa-fire-burner mr-2 text-orange-400"></i> แก้เฉลยลำดับงาน — ด่าน 2 (เชื่อมท่อ)</h2>
                            <p className="text-slate-400 text-sm mt-1">เรียงลำดับขั้นตอนที่ถือว่าถูกต้อง (บน = ทำก่อน) · ใช้ปุ่มลูกศรเลื่อน {changed && <span className="text-yellow-400">(ปรับแต่งแล้ว)</span>}</p>
                        </div>
                        <button onClick={onBack} className="px-4 py-2 rounded-lg bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700 text-sm"><i className="fa-solid fa-arrow-left mr-2"></i>กลับเมนูผู้สอน</button>
                    </div>
                    <div className="space-y-2 mb-5">
                        {list.map((id, i) => (
                            <div key={id} className="flex items-center gap-3 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2">
                                <span className="w-7 h-7 rounded-full bg-orange-600 text-white font-bold text-sm flex items-center justify-center shrink-0">{i + 1}</span>
                                <span className="flex-1 text-sm text-slate-200">{BRAZE_STEPS[id]?.name || id}</span>
                                <button onClick={() => move(i, -1)} disabled={i === 0} className="w-8 h-8 rounded bg-slate-700 hover:bg-slate-600 disabled:opacity-30 text-slate-200"><i className="fa-solid fa-arrow-up"></i></button>
                                <button onClick={() => move(i, 1)} disabled={i === list.length - 1} className="w-8 h-8 rounded bg-slate-700 hover:bg-slate-600 disabled:opacity-30 text-slate-200"><i className="fa-solid fa-arrow-down"></i></button>
                            </div>
                        ))}
                    </div>

                    <div className="mb-6">
                        <div className="text-sm text-slate-300 mb-2"><i className="fa-solid fa-fire mr-2 text-orange-400"></i> ระดับเปลวไฟที่ถูกต้อง</div>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            {FLAME_LEVELS.map(f => (
                                <button key={f.id} onClick={() => setFl(f.id)}
                                    className={`text-left px-3 py-2 rounded-lg border text-sm ${fl === f.id ? 'border-orange-500 bg-orange-900/30 text-orange-100' : 'border-slate-700 bg-slate-900 text-slate-400'}`}>
                                    {f.name}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3">
                        <button onClick={() => onSave({ order: list, flame: fl })} className="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold"><i className="fa-solid fa-floppy-disk mr-2"></i> บันทึกเฉลย</button>
                        <button onClick={onReset} className="px-6 py-3 rounded-xl bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700"><i className="fa-solid fa-rotate-left mr-2"></i> คืนค่าเริ่มต้น</button>
                    </div>
                </div>
            );
        };

        /* ============================================================
           PIPE-KEY EDITOR — โหมดผู้สอน แก้เฉลยการเดินท่อ (ด่าน 4)
        ============================================================ */
        const PipeKeyEditor = ({ pairs, onSave, onReset, onBack }) => {
            const [list, setList] = useState(() => pairs.map(([a, b]) => [a, b]));
            const [na, setNa] = useState(PIPE_NODE_IDS[1]);
            const [nb, setNb] = useState(PIPE_NODE_IDS[2]);
            const changed = JSON.stringify(list) !== JSON.stringify(PIPE_CORRECT);
            const removeAt = (i) => setList(list.filter((_, idx) => idx !== i));
            const add = () => {
                if (na === nb) return;
                if (list.some(([a, b]) => pairKey(a, b) === pairKey(na, nb))) return;
                setList([...list, [na, nb]]);
            };
            return (
                <div className="max-w-3xl mx-auto p-4 sm:p-6 animate-fade-in">
                    <div className="flex items-start justify-between mb-4 gap-3 flex-wrap">
                        <div>
                            <h2 className="text-2xl font-black text-white"><i className="fa-solid fa-diagram-project mr-2 text-blue-400"></i> แก้เฉลยการเดินท่อ — ด่าน 4</h2>
                            <p className="text-slate-400 text-sm mt-1">กำหนดคู่จุดต่อท่อที่ถือว่า “ถูกต้อง” · ตอนนี้ {list.length} เส้น {changed && <span className="text-yellow-400">(ปรับแต่งแล้ว)</span>}</p>
                        </div>
                        <button onClick={onBack} className="px-4 py-2 rounded-lg bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700 text-sm"><i className="fa-solid fa-arrow-left mr-2"></i>กลับเมนูผู้สอน</button>
                    </div>
                    <div className="space-y-2 mb-5">
                        {list.map(([a, b], i) => (
                            <div key={i} className="flex items-center justify-between bg-slate-900 border border-slate-700 rounded-lg px-3 py-2">
                                <span className="text-sm text-slate-200"><span className="text-slate-400">{i + 1}.</span> {PIPE_FULLNAME[a] || a} <i className="fa-solid fa-arrows-left-right mx-2 text-slate-500"></i> {PIPE_FULLNAME[b] || b}</span>
                                <button onClick={() => removeAt(i)} className="text-xs text-slate-400 hover:text-red-400 shrink-0"><i className="fa-solid fa-trash mr-1"></i>ลบ</button>
                            </div>
                        ))}
                        {list.length === 0 && <p className="text-slate-500 text-sm text-center py-4 border border-dashed border-slate-700 rounded-lg">ยังไม่มีคู่ท่อในเฉลย</p>}
                    </div>
                    <div className="bg-slate-800/60 border border-slate-700 rounded-lg p-3 flex flex-wrap items-center gap-2 mb-6">
                        <span className="text-xs text-slate-400">เพิ่มคู่ท่อ:</span>
                        <select value={na} onChange={e => setNa(e.target.value)} className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-sm text-white">
                            {PIPE_NODE_IDS.map(id => <option key={id} value={id}>{PIPE_FULLNAME[id] || id}</option>)}
                        </select>
                        <i className="fa-solid fa-arrows-left-right text-slate-500"></i>
                        <select value={nb} onChange={e => setNb(e.target.value)} className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-sm text-white">
                            {PIPE_NODE_IDS.map(id => <option key={id} value={id}>{PIPE_FULLNAME[id] || id}</option>)}
                        </select>
                        <button onClick={add} className="px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 text-sm font-semibold"><i className="fa-solid fa-plus mr-1"></i>เพิ่ม</button>
                    </div>
                    <div className="flex flex-col sm:flex-row gap-3">
                        <button onClick={() => onSave(list)} className="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold"><i className="fa-solid fa-floppy-disk mr-2"></i> บันทึกเฉลยการเดินท่อ</button>
                        <button onClick={onReset} className="px-6 py-3 rounded-xl bg-slate-800 border border-slate-600 text-slate-300 hover:bg-slate-700"><i className="fa-solid fa-rotate-left mr-2"></i> คืนค่าเริ่มต้น</button>
                    </div>
                </div>
            );
        };

        /* ============================================================
           VACUUM-KEY EDITOR — โหมดผู้สอน แก้ค่าสุญญากาศเป้าหมาย (ด่าน 5)
        ============================================================ */
        const VacuumKeyEditor = ({ value, onSave, onReset, onBack }) => {
            const [t, setT] = useState(String(value.target));
            const num = parseFloat(t);
            const valid = !isNaN(num) && num <= -1 && num >= -49;
            return (
                <div className="max-w-lg mx-auto p-4 sm:p-6 animate-fade-in">
                    <div className="flex items-start justify-between mb-4 gap-3 flex-wrap">

        /* ============================================================

                        <div className="grid grid-cols-2 gap-2 mb-5 bg-[#08213f] p-1 rounded-xl border border-sky-400/20 relative">

        /* ============================================================
           APP
        ============================================================ */
        const App = () => {
            const [student, setStudent] = useState(loadStudent);
            const [screen, setScreen] = useState('map');
            const [mode, setModeRaw] = useState(loadMode);
            const [scores, setScores] = useState(loadScores);
            const [answerKey, setAnswerKey] = useState(loadAnswerKey);
            const [wireKey, setWireKey] = useState(loadWireKey);
            const [extraKey, setExtraKey] = useState(loadExtraKey);
            const [previewAll, setPreviewAll] = useState(loadPreview);
            const [examTotal, setExamTotal] = useState(loadExamTotal);            // วินาที · 0 = จับเวลาแยกรายด่าน
            const [examStartedAt, setExamStartedAt] = useState(loadExamStarted);  // ms เริ่มจับเวลาสอบรวม
            const [examTimedOut, setExamTimedOut] = useState(false);
            const [submitStatus, setSubmitStatus] = useState('idle');   // idle | sending | ok | error | nourl
            const [cheatMsg, setCheatMsg] = useState(() => {
                try { const m = localStorage.getItem('hvac_cheat_notice_v1'); if (m) { localStorage.removeItem('hvac_cheat_notice_v1'); return 'ครั้งก่อนคุณปิด/ออกจากหน้าจอระหว่างสอบ — ระบบถือว่าทุจริตและบันทึกไว้แล้ว กรุณาติดต่อผู้คุมสอบ'; } } catch (e) {}
                return '';
            });
            const [, forceTick] = useState(0);

            const canSubmit = !!APPS_SCRIPT_URL;
            const doSubmit = async () => {
                if (submitStatus === 'sending' || submitStatus === 'ok') return;
                if (!canSubmit) { setSubmitStatus('nourl'); return; }
                setSubmitStatus('sending');
                const res = await submitResultToSheet(buildResultPayload(student, scores, mode, examTimedOut));
                setSubmitStatus(res.ok ? 'ok' : 'error');
            };

            const isTeacher = student && student.role === 'teacher';
            const setMode = (m) => { setModeRaw(m); saveMode(m); };

            // เปลี่ยนหน้า/ด่าน แล้วเลื่อนกลับขึ้นบนสุดเสมอ (กันค้างกลางหน้า)
            useEffect(() => { try { window.scrollTo(0, 0); } catch (e) {} }, [screen]);

            const unlockedIndex = (() => {
                if (previewAll) return MISSIONS.length - 1;
                let u = 0;
                while (u < MISSIONS.length && (scores[MISSIONS[u].id]?.score ?? 0) >= PASS) u++;
                return Math.min(u, MISSIONS.length - 1);
            })();

            // ---- นาฬิกาสอบรวมทั้ง 6 ด่าน ----
            const totalTimerOn = mode === 'exam' && examTotal > 0;
            const examElapsed = examStartedAt ? Math.floor((Date.now() - examStartedAt) / 1000) : 0;
            const examLeft = totalTimerOn ? Math.max(0, examTotal - examElapsed) : null;

            useEffect(() => {
                if (!totalTimerOn || !examStartedAt || examTimedOut) return;
                const iv = setInterval(() => forceTick(n => n + 1), 1000);
                return () => clearInterval(iv);
            }, [totalTimerOn, examStartedAt, examTimedOut]);

            useEffect(() => {
                if (!totalTimerOn || examTimedOut || !examStartedAt || examLeft === null || examLeft > 0) return;
                setExamTimedOut(true);
                if (GAME_COMPONENTS[screen]) {
                    setScores(prev => {
                        if (prev[screen]) return prev;
                        const next = { ...prev, [screen]: { score: 0, feedback: '⏱ หมดเวลาสอบรวม', stars: 0, at: Date.now(), attempts: (prev[screen]?.attempts || 0) + 1 } };
                        saveScores(next);
                        return next;
                    });
                }
                setScreen('complete');
            }, [examLeft, totalTimerOn, examTimedOut, examStartedAt, screen]);

            useEffect(() => {
                if (mode !== 'exam') { setExamStartedAt(null); saveExamStarted(null); setExamTimedOut(false); }
            }, [mode]);

            /* ---- กันโกง: นักเรียนในโหมดสอบ ห้ามสลับหน้าจอ/ปิดหน้าต่าง ---- */
            const cheatActive = !!student && student.role === 'student' && mode === 'exam' && !examTimedOut && screen !== 'complete';
            useEffect(() => {
                if (!cheatActive) return;
                let armed = false;
                const armT = setTimeout(() => { armed = true; }, 1000);   // เว้นช่วงตอนโหลด/สลับด่าน กันเตือนผิดพลาด
                let blurT;

                const violate = (reason) => {
                    if (!armed) return;
                    armed = false;
                    if (APPS_SCRIPT_URL) {
                        const p = buildResultPayload(student, scores, mode, examTimedOut);
                        p.cheated = true; p.cheatReason = reason;
                        submitResultToSheet(p);   // fire-and-forget
                    }
                    setScores({}); try { localStorage.removeItem(KEY); } catch (e) {}
                    setExamStartedAt(null); saveExamStarted(null); setExamTimedOut(false);
                    setStudent(null); saveStudent(null); setSubmitStatus('idle');
                    setScreen('map');
                    setCheatMsg('ตรวจพบการออกจากหน้าจอสอบ (' + reason + ') — ระบบถือว่าทุจริต บันทึกผลไว้แล้ว และนำคุณออกจากระบบ');
                };

                const onVis = () => { if (document.visibilityState === 'hidden') violate('สลับหน้าจอ / ย่อหน้าต่าง / ปิดจอ'); };
                const onBlur = () => { blurT = setTimeout(() => { if (!document.hasFocus()) violate('สลับไปหน้าต่าง/แอปอื่น'); }, 450); };
                const onFocus = () => { clearTimeout(blurT); };
                const onPageHide = () => {
                    if (!armed) return;
                    try { localStorage.setItem('hvac_cheat_notice_v1', 'ปิด/ออกจากหน้าต่างระหว่างสอบ'); } catch (e) {}
                    if (APPS_SCRIPT_URL && navigator.sendBeacon) {
                        const p = buildResultPayload(student, scores, mode, examTimedOut);
                        p.cheated = true; p.cheatReason = 'ปิด/ออกจากหน้าต่างระหว่างสอบ';
                        try { navigator.sendBeacon(APPS_SCRIPT_URL, new Blob([JSON.stringify(p)], { type: 'text/plain;charset=utf-8' })); } catch (e) {}
                    }
                    try { localStorage.removeItem(ST_KEY); localStorage.removeItem(KEY); localStorage.removeItem(ES_KEY); } catch (e) {}
                };

                document.addEventListener('visibilitychange', onVis);
                window.addEventListener('blur', onBlur);
                window.addEventListener('focus', onFocus);
                window.addEventListener('pagehide', onPageHide);
                return () => {
                    clearTimeout(armT); clearTimeout(blurT);
                    document.removeEventListener('visibilitychange', onVis);
                    window.removeEventListener('blur', onBlur);
                    window.removeEventListener('focus', onFocus);
                    window.removeEventListener('pagehide', onPageHide);
                };
            }, [cheatActive, student, scores, mode, examTimedOut]);

            // พรีวิวทุกด่าน (เฉพาะผู้สอนที่ล็อกอินแล้วเท่านั้นจึงเห็นปุ่มนี้)
            const togglePreview = () => { const v = !previewAll; setPreviewAll(v); savePreview(v); };

            const handleFinishGame = (id, score, feedback) => {
                setScores(prev => {
                    const prevRec = prev[id] || {};
                    const keepBest = score >= (prevRec.score ?? -1);
                    const rec = keepBest
                        ? { score, feedback, stars: starOf(score), at: Date.now(), attempts: (prevRec.attempts || 0) + 1 }
                        : { ...prevRec, attempts: (prevRec.attempts || 0) + 1 };
                    const next = { ...prev, [id]: rec };
                    saveScores(next);
                    return next;
                });
                setScreen('map');
            };

            const resetProgress = () => {
                if (!window.confirm('ล้างความคืบหน้าทั้งหมด? การกระทำนี้ย้อนกลับไม่ได้')) return;
                setScores({});
                try { localStorage.removeItem(KEY); } catch (e) {}
                setExamStartedAt(null); saveExamStarted(null); setExamTimedOut(false);
                setScreen('map');
            };

            const login = (s) => { setStudent(s); saveStudent(s); setSubmitStatus('idle'); setCheatMsg(''); setScreen('map'); };
            const logout = () => {
                const stu = student && student.role !== 'teacher';
                if (!window.confirm(stu ? 'ออกจากระบบและล้างผลสอบของผู้เข้าสอบคนนี้?' : 'ออกจากระบบผู้สอน?')) return;
                setStudent(null); saveStudent(null); setSubmitStatus('idle');
                if (stu) {
                    setScores({}); try { localStorage.removeItem(KEY); } catch (e) {}
                    setExamStartedAt(null); saveExamStarted(null); setExamTimedOut(false);
                }
                setScreen('map');
            };

            const beginExamClock = () => { if (!examStartedAt) { const t = Date.now(); setExamStartedAt(t); saveExamStarted(t); } };
            const setExamTotalMin = (min) => {
                const sec = Math.max(0, Math.round(min)) * 60;
                setExamTotal(sec); saveExamTotal(sec);
                setExamStartedAt(null); saveExamStarted(null); setExamTimedOut(false);
            };

            const selectMission = (id) => {
                if (examTimedOut) return;
                const idx = MISSIONS.findIndex(m => m.id === id);
                if (idx <= unlockedIndex) {
                    if (mode === 'exam' && examTotal > 0) beginExamClock();
                    setScreen(id);
                }
            };

            const saveKey = (diff) => { setAnswerKey(diff); saveAnswerKey(diff); setScreen('teacher'); };
            const resetKey = () => { setAnswerKey({}); try { localStorage.removeItem(AK_KEY); } catch (e) {} setScreen('teacher'); };
            const saveWK = (pairs) => { setWireKey(pairs); saveWireKey(pairs); setScreen('teacher'); };
            const resetWK = () => { setWireKey(null); try { localStorage.removeItem(WK_KEY); } catch (e) {} setScreen('teacher'); };
            const saveExtra = (patch) => setExtraKey(prev => { const n = { ...prev, ...patch }; saveExtraKey(n); return n; });

            const prepCustom = Object.keys(answerKey).length > 0;
            const wireCustom = !!(wireKey && wireKey.length);
            const brazeCustom = extraKey.braze.join(',') !== EK_DEFAULT.braze.join(',') || extraKey.brazeFlame !== EK_DEFAULT.brazeFlame;
            const pipeCustom = JSON.stringify(extraKey.pipe) !== JSON.stringify(EK_DEFAULT.pipe);
            const vacCustom = extraKey.vacuum.target !== EK_DEFAULT.vacuum.target;
            const chargeCustom = JSON.stringify(extraKey.charge) !== JSON.stringify(EK_DEFAULT.charge);
            const akCustomized = prepCustom || wireCustom || extraCustomized(extraKey);

            const teacherScreen = screen === 'teacher' || screen.indexOf('teacher_') === 0;

            let body;
            if (GAME_COMPONENTS[screen] && MISSIONS.findIndex(m => m.id === screen) <= unlockedIndex) {
                body = <MissionFrame mission={MISSIONS.find(m => m.id === screen)} mode={mode} answerKey={answerKey} wireKey={wireKey} extraKey={extraKey}
                    totalTimerOn={totalTimerOn} totalLeft={examLeft} onDone={handleFinishGame} onExit={() => setScreen('map')} />;
            } else if (screen === 'complete') {
                body = <CompleteScreen scores={scores} student={student} timedOut={examTimedOut}
                    canSubmit={canSubmit} submitStatus={submitStatus} onSubmit={doSubmit} onBack={() => setScreen('map')} />;
            } else if (teacherScreen && !isTeacher) {
                body = <LevelMap scores={scores} unlockedIndex={unlockedIndex} isTeacher={false} akCustomized={akCustomized} previewAll={previewAll}
                    examLeft={examLeft} examTimedOut={examTimedOut}
                    onTogglePreview={togglePreview} onSelect={selectMission} onReset={resetProgress} onTeacher={() => {}} onShowComplete={() => setScreen('complete')} />;
            } else if (screen === 'teacher') {
                body = <TeacherHub prepCustom={prepCustom} brazeCustom={brazeCustom} wireCustom={wireCustom} pipeCustom={pipeCustom} vacCustom={vacCustom} chargeCustom={chargeCustom}
                    mode={mode} onSetMode={setMode}
                    examTotalMin={Math.round(examTotal / 60)} onSetExamTotal={setExamTotalMin}
                    onGo={(k) => setScreen('teacher_' + k)} onClose={() => setScreen('map')} />;
            } else if (screen === 'teacher_prep') {
                body = <AnswerKeyEditor override={answerKey} onSave={saveKey} onReset={resetKey} onBack={() => setScreen('teacher')} />;
            } else if (screen === 'teacher_braze') {
                body = <BrazeKeyEditor order={extraKey.braze} flame={extraKey.brazeFlame}
                    onSave={(v) => { saveExtra({ braze: v.order, brazeFlame: v.flame }); setScreen('teacher'); }}
                    onReset={() => { saveExtra({ braze: EK_DEFAULT.braze.slice(), brazeFlame: EK_DEFAULT.brazeFlame }); setScreen('teacher'); }}
                    onBack={() => setScreen('teacher')} />;
            } else if (screen === 'teacher_wire') {
                body = <WireKeyEditor pairs={(wireKey && wireKey.length) ? wireKey : WIRE_CORRECT} custom={wireCustom} onSave={saveWK} onReset={resetWK} onClose={() => setScreen('teacher')} />;
            } else if (screen === 'teacher_pipe') {
                body = <PipeKeyEditor pairs={extraKey.pipe}
                    onSave={(v) => { saveExtra({ pipe: v }); setScreen('teacher'); }}
                    onReset={() => { saveExtra({ pipe: EK_DEFAULT.pipe.map(p => p.slice()) }); setScreen('teacher'); }}
                    onBack={() => setScreen('teacher')} />;
            } else if (screen === 'teacher_vacuum') {
                body = <VacuumKeyEditor value={extraKey.vacuum}
                    onSave={(v) => { saveExtra({ vacuum: v }); setScreen('teacher'); }}
                    onReset={() => { saveExtra({ vacuum: { ...EK_DEFAULT.vacuum } }); setScreen('teacher'); }}
                    onBack={() => setScreen('teacher')} />;
            } else if (screen === 'teacher_charge') {
                body = <ChargeKeyEditor value={extraKey.charge}
                    onSave={(v) => { saveExtra({ charge: v }); setScreen('teacher'); }}
                    onReset={() => { saveExtra({ charge: { ...EK_DEFAULT.charge } }); setScreen('teacher'); }}
                    onBack={() => setScreen('teacher')} />;
            } else {
                body = <LevelMap scores={scores} unlockedIndex={unlockedIndex} isTeacher={isTeacher} akCustomized={akCustomized} previewAll={previewAll}
                    examLeft={examLeft} examTimedOut={examTimedOut}
                    onTogglePreview={togglePreview} onSelect={selectMission} onReset={resetProgress} onTeacher={() => setScreen('teacher')} onShowComplete={() => setScreen('complete')} />;
            }

            if (!student) return (
                <div className="min-h-screen"><StudentLogin onLogin={login} notice={cheatMsg} /></div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    <Header mode={mode} setMode={setMode} goMap={() => setScreen('map')} student={student} onLogout={logout} />
                    <main className="flex-1 relative">
                        <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-sky-500/20 rounded-full blur-[130px] pointer-events-none -z-10"></div>
                        <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/15 rounded-full blur-[130px] pointer-events-none -z-10"></div>
                        {body}
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
